<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de trabajo · La IA en acción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Atkinson+Hyperlegible:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1437;--navy2:#26185f;--cyan:#22D3EE;--violet:#7C3AED;--paper:#F4F6FF;--card:#FFFFFF;--ink:#1E1B4B;--muted:#5B6180;--line:#D7DCF0;
--A:#16A34A;--Aa:#DCFCE7;--B:#2563EB;--Ba:#DBEAFE;--M:#EA580C;--Ma:#FFEDD5;--X:#DB2777;--Xa:#FCE7F3;--ok:#16A34A;--okbg:#DCFCE7;--warn:#B45309;--warnbg:#FEF3C7;--bad:#DC2626;--badbg:#FEE2E2;
--acc:var(--violet);--acca:#EDE9FE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1330;--card:#1A1F45;--ink:#EEF0FF;--muted:#A6ACD0;--line:#34396A;--Aa:#123A24;--Ba:#14295A;--Ma:#4A2410;--Xa:#4A1633;--okbg:#123A24;--warnbg:#45330C;--badbg:#4A1616;--acca:#2E2466}}
:root[data-theme="dark"]{--paper:#0F1330;--card:#1A1F45;--ink:#EEF0FF;--muted:#A6ACD0;--line:#34396A;--Aa:#123A24;--Ba:#14295A;--Ma:#4A2410;--Xa:#4A1633;--okbg:#123A24;--warnbg:#45330C;--badbg:#4A1616;--acca:#2E2466}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:20px;line-height:1.5}
h1,h2,h3{font-family:'Audiowide','Trebuchet MS',sans-serif;font-weight:400;line-height:1.2;margin:0}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--cyan);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:44px;height:50px;object-fit:contain}
.brand{font-family:'Permanent Marker',cursive;font-size:24px;margin-right:auto}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 14px;font-size:16px;cursor:pointer}
.nav button[aria-current="true"]{background:var(--cyan);color:var(--navy);border-color:var(--cyan);font-weight:700}
main{max-width:920px;margin:0 auto;padding:22px 16px 120px}
.hero{background:radial-gradient(circle at 85% 20%,rgba(34,211,238,.35),transparent 45%),linear-gradient(135deg,var(--navy),#3b1c8f);color:#fff;border-radius:28px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero h1{font-family:'Permanent Marker',cursive;font-size:clamp(40px,7vw,64px)}
.hero p{margin:4px 0 0;font-family:'Audiowide',sans-serif;color:#FDE047;font-size:22px}
.hero img{width:130px}
.auto{margin:20px 0;background:#FEF08A;color:#1E1B4B;border:4px solid #EAB308;border-radius:24px;padding:18px 22px}
.auto h2{font-size:26px}
.auto p{margin:6px 0 0;font-size:20px}
.namefield{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.namefield input{flex:1;min-width:200px;padding:10px 14px;border-radius:14px;border:3px solid #CA8A04;background:#fff;color:#1E1B4B}
.choose-title{text-align:center;font-size:28px;margin:26px 0 4px}
.choose-sub{text-align:center;color:var(--muted);margin:0 0 16px}
.choices{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.or{align-self:center;width:58px;height:58px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-family:'Audiowide';font-size:24px;background:var(--card)}
.choice{background:var(--card);border:5px solid var(--c);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:10px}
.choice .pics{display:flex;gap:8px;justify-content:center;background:var(--ca);border-radius:18px;padding:10px}
.choice .pics img{width:110px;height:110px}
.letter{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--c);color:#fff;font-family:'Audiowide';font-size:30px;margin-right:10px;vertical-align:middle}
.choice h3{font-size:22px}
.choice .meta{color:var(--c);font-weight:700;font-size:17px}
.btn{border:none;border-radius:999px;padding:14px 26px;font-weight:700;font-size:20px;cursor:pointer;background:var(--acc);color:#fff;min-height:56px}
.btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--line)}
.btn.big{width:100%}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:26px;text-align:center}
.path div{font-weight:700;font-size:17px}
.path span{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;color:#fff;font-family:'Audiowide';font-size:26px}
.stephead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.pill{background:var(--acc);color:#fff;border-radius:999px;padding:6px 16px;font-family:'Audiowide';font-size:17px}
.dots{margin-left:auto;display:flex;gap:8px;align-items:center;font-family:'Audiowide';font-size:15px;color:var(--muted)}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--acc);display:inline-block}
.dots i.on{background:var(--acc)}
.extitle{display:flex;align-items:center;gap:14px;margin:14px 0}
.extitle b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--acc);color:#fff;font-family:'Audiowide';font-size:28px;flex:none}
.extitle h2{font-size:clamp(24px,4vw,34px)}
.consigna{display:flex;gap:14px;align-items:center;background:var(--acca);border:4px solid var(--acc);border-radius:22px;padding:16px 18px;font-weight:700;font-size:22px;margin-bottom:22px}
.consigna img{width:64px;flex:none}
.video{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.video a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700}
.video{flex-direction:column;align-items:flex-start}
.vrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vrow button.vbtn{display:inline-flex;align-items:center;gap:10px;border:none;cursor:pointer;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;min-height:52px}
.vrow button.vbtn::before{content:"";width:0;height:0;border-left:16px solid var(--cyan);border-top:10px solid transparent;border-bottom:10px solid transparent}
.vrow button.vhelp{background:none;border:none;color:var(--acc);font-weight:700;text-decoration:underline;cursor:pointer;padding:8px}
.vbox{width:100%;background:#0F172A;border-radius:22px;padding:10px;margin-bottom:8px}.vbox video{display:block;width:100%;max-height:70vh;border-radius:14px;background:#000}.vhint{margin:8px 4px 0;color:#fff;font-weight:700;font-size:16px}
.vfall{display:none;width:100%;background:var(--acca);border:3px dashed var(--acc);border-radius:18px;padding:14px;margin-top:4px}
.vfall.show{display:block}
.vfall p{margin:0 0 8px;font-weight:700}
.vfall .vrow input{flex:1;min-width:200px;border:3px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--card)}
.video a::before{content:"";width:0;height:0;border-left:16px solid var(--cyan);border-top:10px solid transparent;border-bottom:10px solid transparent}
.opts{display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 18px;cursor:pointer;text-align:left;font-size:21px;font-weight:700;width:100%}
.opt img{width:90px;height:90px;flex:none}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acca);box-shadow:0 0 0 3px var(--acc) inset}
.tick{margin-left:auto;width:40px;height:40px;border-radius:12px;border:3px solid var(--acc);flex:none;display:grid;place-items:center;font-size:26px;color:#fff}
.opt[aria-pressed="true"] .tick{background:var(--acc)}
.opt[aria-pressed="true"] .tick::after{content:"✓"}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{flex-direction:column;text-align:center;justify-content:center;padding:16px;position:relative}
.tile img{width:130px;height:130px}
.tile .tick{position:absolute;top:12px;right:12px;margin:0}
.screen{background:#0F172A;color:#fff;border-radius:24px;padding:24px;font-size:24px;font-weight:700;line-height:2.4}
.screen p{margin:0}
input.gap{display:inline-block;border:none;border-bottom:4px solid var(--cyan);background:rgba(255,255,255,.12);color:inherit;border-radius:10px 10px 4px 4px;padding:2px 10px;font-weight:700;text-align:center;min-width:4ch}
.news input.gap{background:var(--acca);border-bottom-color:var(--acc)}
.gapwrap{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.3;margin:0 4px}
.gapwrap small{font-size:15px;font-weight:400;opacity:.8}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.warn{background:var(--warnbg)!important;border-color:var(--warn)!important;color:var(--warn)!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important;color:var(--bad)!important}
.fb{margin-top:14px;font-weight:700;border-radius:16px;padding:12px 16px;display:none}
.fb.show{display:block}
.vf{display:flex;align-items:center;gap:12px;background:#1E1B4B;color:#fff;border-radius:20px;padding:14px 18px;margin-top:12px;font-weight:700}
.vf span{flex:1}
.vf button{width:64px;height:64px;border-radius:50%;border:4px solid transparent;font-family:'Audiowide';font-size:24px;color:#fff;cursor:pointer;opacity:.55}
.vf button[aria-pressed="true"]{opacity:1;border-color:#fff;transform:scale(1.08)}
.vf .v{background:#16A34A}.vf .f{background:#DC2626}
h3.sub{font-size:22px;margin:26px 0 8px}
.quad{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.q{border-radius:22px;padding:16px;border:4px solid var(--qc);background:var(--card)}
.q header{display:flex;align-items:center;gap:10px;font-family:'Audiowide';font-size:24px;margin-bottom:8px}
.q img{width:60px}
textarea,.field{width:100%;border:3px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card);min-height:64px;resize:vertical;font-size:20px}
.news{background:var(--card);border:6px solid #0F172A;border-radius:24px;overflow:hidden}
.news .bar{display:flex;background:#1E293B;color:#fff;font-weight:700}
.news .bar b{background:var(--bn,#DC2626);padding:10px 18px;font-family:'Audiowide';font-weight:400}
.news .bar span{padding:10px 16px}
.news .body{padding:20px;font-size:24px;font-weight:700;line-height:2.5}
.opin{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.opin .opt{justify-content:center}
.opin img{width:70px;height:70px}
.bonusbox{margin-top:28px;border:4px solid var(--X);background:var(--Xa);border-radius:24px;padding:18px}
.bonusbox .pill{background:var(--X)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{border:3px solid var(--acc);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff}
.navbtns{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--line);display:flex;gap:12px;justify-content:space-between;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.navbtns .btn{flex:1;max-width:440px}
.navbtns[hidden]{display:none}
.check{margin-top:16px;background:var(--navy)}
.phone{background:#1E1B4B;border-radius:34px;padding:14px}
.phone .in{background:var(--paper);border-radius:24px;overflow:hidden}
.phone .hd{background:var(--pc,#166534);color:#fff;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:10px}
.phone .hd img{width:34px}
.bubble{background:var(--bb,#BBF7D0);color:#1E1B4B;margin:14px;border-radius:22px;padding:14px 16px}
.bubble label{font-weight:700;display:block;margin-bottom:6px}
.bubble textarea{background:#fff;color:#1E1B4B;border-color:transparent;min-height:56px}
table.cmp{width:100%;border-collapse:separate;border-spacing:8px}
table.cmp th{font-family:'Audiowide';font-weight:400;color:#fff;border-radius:16px;padding:10px}
table.cmp td:first-child{font-weight:700;background:var(--Ma);border-radius:16px;padding:10px;width:28%}
table.cmp td textarea{min-height:80px}
.wrapx{overflow-x:auto}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.hub button{background:var(--card);border:4px solid var(--X);border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:21px;text-align:left;cursor:pointer}
.hub img{width:80px;height:80px}
.bank{display:flex;gap:10px;flex-wrap:wrap;background:var(--Xa);border:4px solid var(--X);border-radius:22px;padding:14px 18px;align-items:center}
.bank b{font-family:'Permanent Marker';color:var(--X);font-size:26px;margin-right:6px}
.bank span{background:var(--card);border:3px solid var(--violet);border-radius:999px;padding:6px 16px;font-weight:700}
.pics5{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.pic{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;text-align:center}
.pic img{width:130px;height:130px}
.pic small{display:block;color:var(--muted);font-style:italic;margin-bottom:8px}
select{width:100%;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--card);font-weight:700}
table.conj{width:100%;border-collapse:separate;border-spacing:6px}
table.conj th{background:var(--X);color:#fff;border-radius:14px;padding:10px}
table.conj td:first-child{font-weight:700;background:var(--Xa);border-radius:14px;padding:10px}
table.conj input{width:100%;border:3px solid var(--line);border-radius:12px;padding:8px;background:var(--card);font-weight:700;text-align:center}
.sent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;font-weight:700}
.letter-msg{background:#fff;color:#1E1B4B;margin:14px;border-radius:20px;padding:16px 18px}
.done{text-align:center}
.aidbank{background:#FEF3C7;border:3px dashed #D97706;border-radius:18px;padding:12px 16px;margin:12px 0}
.aidonly{display:none}body.aid .aidonly{display:block}
.pdfbox{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:linear-gradient(120deg,var(--navy),#3b1c8f);color:#fff;border-radius:24px;padding:20px 22px;margin:18px 0}
.pdfbox>div{flex:1;min-width:240px}.pdfbox p{margin:4px 0 0}
.pdfbox .btn{background:#FDE047;color:#1E1B4B}
.pdfbox .pdfmsg{flex-basis:100%;font-weight:700;color:#A5F3FC;margin:0}
.lock{background:var(--card);border:4px dashed var(--acc);border-radius:24px;padding:22px;text-align:center}
.lock h2{font-size:26px;margin:8px 0}
.lock ul{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px;text-align:left}
.lock li{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}
.lock li.okk{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.lock li button{margin-left:auto;padding:8px 16px;min-height:0;font-size:17px}
.padlock{width:64px;height:64px;margin:0 auto;border-radius:18px;background:var(--acc);display:grid;place-items:center;color:#fff;font-family:'Audiowide';font-size:18px}
.corr{display:grid;gap:12px}
.cr{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 16px}
.cr h4{margin:0 0 6px;font-family:'Audiowide';font-weight:400;font-size:18px;color:var(--acc)}
.cr .me{border-radius:12px;padding:6px 10px;margin:4px 0;border:2px solid var(--line)}
.cr .sol{font-weight:700}
.cr .sol::before{content:"Respuesta: ";color:var(--muted);font-weight:400}
.cr .me::before{content:"Tú: ";font-weight:700}
.ansbox{margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(11,20,55,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal div{background:var(--card);border-radius:24px;padding:24px;max-width:460px;width:100%;border:4px solid var(--acc)}
.modal p{font-weight:700;font-size:22px;margin:0 0 18px}
.modal .row{justify-content:flex-end}
.done img{width:150px}
pre.sum{white-space:pre-wrap;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px;font-family:inherit;font-size:18px}
@media (max-width:640px){body{font-size:18px}.choices{grid-template-columns:1fr}.or{justify-self:center}.hero{grid-template-columns:1fr}.hero img{display:none}.opin{grid-template-columns:1fr}.path{grid-template-columns:repeat(2,1fr);row-gap:16px}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}}
@media print{.top,.navbtns,.btn{display:none!important}main{padding:0}}
</style>
</head>
<body>
<header class="top"><img alt="" id="logo"><div class="brand">Plan de trabajo</div><span id="adminBadge" style="display:none;background:#FDE047;color:#1E1B4B;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;margin-right:8px">Modo profesor · todo abierto</span><nav class="nav" id="nav" aria-label="Secciones"></nav></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

 bn2:[['Tus 3 preguntas','Ejemplos: ¿Dónde naciste? · ¿Por qué tienes un bigote tan largo? · ¿Cómo pintas tus cuadros?'],['Comprueba','Cada pregunta empieza con ¿ y termina con ?']],
 bn3:[['1','la llama'],['2','la cancha'],['3','la papa'],['4','el cóndor'],['5','el puma'],['¿Qué animal viste en Nazca?','el cóndor']],
 bn4:[['anunciar','anunció · anunciaron'],['analizar','analizó · analizaron'],['crear','creó · crearon'],['descubrir','descubrió · descubrieron'],['presentar','presentó · presentaron'],['explicar','explicó · explicaron'],['¿Presente o indefinido?','analizó · presenta · anunció · ayuda']]};
function ansSection(n){return `<div class="ansbox"><button class="btn" id="showans" style="background:var(--navy)">Ver las respuestas</button><div id="ansout" role="status"></div></div>`}
function bindAns(n){$('#showans').onclick=()=>{const miss=BNK[n].filter(k=>!filled(k)).length;const out=$('#ansout');
 if(miss){out.innerHTML=`<div class="fb show bad pop">Completa todo antes de ver las respuestas (${miss} ${miss>1?'respuestas vacías':'respuesta vacía'}).</div>`;return}
 out.innerHTML=`<div class="corr pop" style="margin-top:14px">${BNSOL[n].map(r=>crRow(r[0],null,r[1],'')).join('')}</div>`}}
function bnHead(n,t){return `<div class="stephead"><span class="pill">Bonus ${n}</span><strong>${t}</strong></div>`}
function bn1(){setAcc('var(--X)','var(--Xa)');if(bonusLocked())return;const qs=['¿Quién escribe? ¿A quién?','¿Qué regala el robot?','¿Estás de acuerdo con Bad Bunny? ¿Por qué?','Desafío: escribe la respuesta de Bad Bunny.'];
 $('#app').innerHTML=`<div class="pop">${bnHead(1,'Bad Bunny y el robot')}${consigna('Lee el mensaje del robot y contesta las preguntas.')}
 <p style="font-weight:700">En 2023, una canción hecha con IA imitó la voz del cantante Bad Bunny. Bad Bunny se enfadó mucho. Entonces, FlowGPT, el «robot» que creó la canción, le respondió:</p>
 <div class="phone" style="--pc:#7C3AED"><div class="in"><div class="hd" style="background:#7C3AED">${img('robot')}FlowGPT</div><div class="letter-msg"><p style="margin:0 0 8px"><i><b>Hola, Benito:</b></i></p><p style="margin:0">Soy FlowGPT, un robot. Siento mucho tu enfado. Un equipo me creó para probar nuevas tecnologías y hacer música. Me encantan tus canciones. Te regalo mi canción, gratis. ¿Por qué no la grabas tú?</p><p style="margin:8px 0 0"><i><b>FlowGPT</b></i></p></div></div></div>
 <p style="color:var(--muted);font-style:italic">Benito es el nombre real de Bad Bunny.</p>${qs.map((q,j)=>`<h3 class="sub">${j+1}. ${q}</h3><textarea data-k="bn1q${j}"></textarea>`).join('')}${ansSection('bn1')}</div>`;
 bindInputs();bindAns('bn1');bottom(()=>go('bonus'),()=>go('bonus'),'Volver a los bonus')}
function bn2(){setAcc('var(--X)','var(--Xa)');if(bonusLocked())return;
 $('#app').innerHTML=`<div class="pop">${bnHead(2,'Preguntas para Dalí')}${consigna('Mira el vídeo con los subtítulos en español (la voz está en inglés). Después, escribe 3 preguntas para Dalí.')}
 <div class="row">${img('dali')}<p style="font-weight:700;flex:1;min-width:240px">Salvador Dalí fue un pintor español muy famoso. Murió en 1989. En 2019, un museo de Florida creó un Dalí virtual con IA. ¡Habla con los visitantes y se hace selfis con ellos!</p></div>
 ${vids([['El vídeo del museo · subtítulos en español',VURL.D]])}
 ${['¿Dónde…?','¿Por qué…?','¿Cómo…?'].map((q,j)=>`<h3 class="sub">${q}</h3><input class="field" data-k="bn2q${j}" placeholder="${q}">`).join('')}
 <h3 class="sub">Desafío: imagina la respuesta de Dalí.</h3><textarea data-k="bn2d"></textarea>${ansSection('bn2')}</div>`;
 bindInputs();bindAns('bn2');bottom(()=>go('bonus'),()=>go('bonus'),'Volver a los bonus')}
function bn3(){setAcc('var(--X)','var(--Xa)');if(bonusLocked())return;const W=['la papa','la llama','el cóndor','el puma','la cancha'];
 const P=[['llama','un animal con lana','la llama'],['cancha','para jugar al fútbol','la cancha'],['papa','una verdura','la papa'],['condor','un pájaro enorme','el cóndor'],['puma','un gato muy grande','el puma']];
 $('#app').innerHTML=`<div class="pop">${bnHead(3,'Palabras quechuas')}${consigna('Mira los dibujos. Elige la palabra correcta para cada dibujo.')}
 <p style="font-weight:700">Estas palabras vienen del quechua, la lengua de Illariy.</p><div class="bank"><b>Caja:</b>${W.map(w=>`<span>${w}</span>`).join('')}</div>
 <div class="pics5">${P.map((p,j)=>`<div class="pic">${img(p[0])}<small>${p[1]}</small><select data-k="bn3s${j}" data-ans='${JSON.stringify([p[2]])}' aria-label="Dibujo ${j+1}"><option value="">Elige…</option>${W.map(w=>`<option>${w}</option>`).join('')}</select></div>`).join('')}</div>
 <h3 class="sub">¿Qué animal viste en Nazca?</h3><input class="field" data-k="bn3n" data-ans='["el cóndor","cóndor"]' style="max-width:360px">${checkBtn('c3b')}${ansSection('bn3')}</div>`;
 bindInputs();document.querySelectorAll('select[data-k]').forEach(s=>s.addEventListener('change',()=>{S.ans[s.dataset.k]=s.value;s.classList.remove('ok','warn','bad');save()}));
 $('#c3b').onclick=()=>runCheck($('#app'),'c3b');bindAns('bn3');bottom(()=>go('bonus'),()=>go('bonus'),'Volver a los bonus')}
function bn4(){setAcc('var(--X)','var(--Xa)');if(bonusLocked())return;const V=[['anunciar','anunció','anunciaron'],['analizar','analizó','analizaron'],['crear','creó','crearon'],['descubrir','descubrió','descubrieron'],['presentar','presentó','presentaron'],['explicar','explicó','explicaron']];
 const T=[['En 2024, la IA','analiza','analizó','miles de fotos.','analizó'],['Hoy, Illariy','presenta','presentó','las noticias.','presenta'],['En 2026, la Liga MX','anuncia','anunció','una novedad.','anunció'],['Ahora, el sistema','ayuda','ayudó','a los árbitros.','ayuda']];
 $('#app').innerHTML=`<div class="pop">${bnHead(4,'La máquina de verbos')}${consigna('Conjuga los verbos en pretérito indefinido. Después, elige la buena forma: ¿presente o pretérito indefinido?')}
 <div class="wrapx"><table class="conj"><thead><tr><th>Verbo</th><th>él / ella</th><th>ellos / ellas</th></tr></thead><tbody>${V.map((v,j)=>`<tr><td>${v[0]}</td><td><input data-k="bn4a${j}" data-ans='["${v[1]}"]' aria-label="${v[0]} él" autocapitalize="off" spellcheck="false"></td><td><input data-k="bn4b${j}" data-ans='["${v[2]}"]' aria-label="${v[0]} ellos" autocapitalize="off" spellcheck="false"></td></tr>`).join('')}</tbody></table></div>
 <h3 class="sub">¿Presente o pretérito indefinido?</h3>${T.map((t,j)=>`<div class="sent" data-sol="bn4t${j}" data-v="${t[4]}"><span>${t[0]}</span><button class="chip" data-t="bn4t${j}" data-v="${t[1]}">${t[1]}</button><button class="chip" data-t="bn4t${j}" data-v="${t[2]}">${t[2]}</button><span>${t[3]}</span></div>`).join('')}
 ${checkBtn('c4b')}<h3 class="sub">Desafío: una frase en pretérito indefinido sobre Aitana, Nazca o tu vídeo.</h3><textarea data-k="bn4d"></textarea>${ansSection('bn4')}</div>`;
 bindInputs();toggles();$('#c4b').onclick=()=>runCheck($('#app'),'c4b');bindAns('bn4');bottom(()=>go('bonus'),()=>go('bonus'),'Volver a los bonus')}
function fin(){setAcc('var(--violet)','#EDE9FE');const a=S.ans,k=S.act,A=ACT[k]||null;const L=[];const t=v=>(Array.isArray(v)?v.join(', '):(v||'—'));
 L.push('PLAN DE TRABAJO · LA IA EN ACCIÓN','Nombre: '+(S.name||'—'),'Actividad: '+(A?k+' · '+A.title:'—'),'');
 if(A){L.push('0. Repaso: '+REP.map(p=>t(a[p[1].id])).join(' / '));L.push('1. Enigma: '+A.enigma.qs.map((_,j)=>t(a[k+'e'+j])).join(' / '));
  L.push('2. General: '+t(a[k+'g0'])+' · palabras: '+[0,1,2].map(j=>t(a[k+'g2'+j])).join(', '));
  L.push('3. Información: '+A.info.map(x=>t(a[x.id])).join(' / '));
  L.push('4. Detalles: V/F '+A.vf.map((_,j)=>t(a[k+'vf'+j])+' ('+t(a[k+'vfp'+j])+')').join(', ')+' · enigma: '+t(a[k+'er']));
  L.push('4. Opinión: la IA '+t(a[k+'op'])+' porque '+t(a[k+'porque']));
  if(k==='B')L.push('Bonus: mi nombre significa '+t(a.Bnombre))}
 L.push('','MEDIACIÓN','- '+t(a.m0),'- '+t(a.m1),'- '+t(a.m2),'Juntos: vídeo '+t(a.jv)+' porque '+t(a.jporque));
 const bl=[];if(a.bn1q0)bl.push('Bonus 1: '+[0,1,2,3].map(j=>t(a['bn1q'+j])).join(' / '));if(a.bn2q0)bl.push('Bonus 2: '+[0,1,2].map(j=>t(a['bn2q'+j])).join(' / '));if(a.bn3s0)bl.push('Bonus 3: '+[0,1,2,3,4].map(j=>t(a['bn3s'+j])).join(', '));if(a.bn4a0)bl.push('Bonus 4: '+[0,1,2,3,4,5].map(j=>t(a['bn4a'+j])+'/'+t(a['bn4b'+j])).join(', '));
 if(bl.length)L.push('','BONUS',...bl);const txt=L.join('\n');
 $('#app').innerHTML=`<div class="pop done">${img('robot')}<h2 style="margin:10px 0">¡Buen trabajo${S.name?', '+esc(S.name):''}!</h2><p>Aquí están todas tus respuestas.</p></div>${pdfBlock()}<pre class="sum">${esc(txt)}</pre>
 <div class="row"><button class="btn" id="cp">Copiar mis respuestas</button><button class="btn ghost" id="rs">Empezar de nuevo</button></div><p id="cpmsg" role="status" style="font-weight:700;color:var(--ok)"></p>`;
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cpmsg').textContent='Respuestas copiadas.'}catch(e){$('#cpmsg').textContent='Selecciona el texto y cópialo.'}};
 $('#rs').onclick=()=>ask('¿Borrar todas tus respuestas y empezar de nuevo?',()=>{S={name:'',act:null,screen:'portada',step:0,ans:{}};save();render()},'Sí, borrar');
 bindPDF();bottom(()=>go('bonus'),()=>go('portada'),'Volver al inicio')}

 if(s==='act'&&!S.act)S.screen='portada';
 ({portada,rep:repScreen,ser:serScreen,act:actScreen,corr,med1,med2,bonus,bn1,bn2,bn3,bn4,fin}[S.screen]||portada)();
 bindVideos();aidBank();
 if(S.screen==='portada')bindInputs()}

if(ADMIN){const b=document.getElementById('adminBadge');if(b){b.style.display='inline-block';b.title='Para volver al modo alumno, abre la página con #alumno';b.onclick=()=>{if(confirm('¿Salir del modo profesor?')){try{localStorage.removeItem('ia-plan-admin')}catch(e){}location.replace(location.pathname)}}}}
