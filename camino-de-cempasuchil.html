<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>El camino de cempasúchil</title>
<style>
:root{--ind:#120a2e;--vio:#2a1250;--nar:#ff9a1f;--nar2:#ffb648;--mag:#e0218a;--tur:#22c7c0;--oro:#f0c75e;--hue:#f3e9d2;--txt:#f8f1e4;--sua:#cdbfe6;--pan:rgba(20,11,50,.82);--lin:rgba(240,199,94,.28);--lh:1.45;--fs:1}
*{box-sizing:border-box}
html{font-size:calc(clamp(14px,.62vw + .75vh,21px)*var(--fs))}
html.big{--fs:1.2;--lh:1.85}
html.big body{letter-spacing:.02em;word-spacing:.08em}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#0b0620 linear-gradient(#0d0725,#2a1250 70%,#3a1550);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:var(--lh);-webkit-font-smoothing:antialiased}
h1,h2,h3,.tit{font-family:Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif;font-weight:700;letter-spacing:.01em;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#gl{z-index:0}#fx{z-index:2}
#fg{position:fixed;left:-4%;right:-4%;bottom:0;height:17vh;z-index:1;pointer-events:none;opacity:.9;transition:opacity 1s}
#fg svg{width:100%;height:100%;display:block}
#luz{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle 26vmax at var(--mx,50%) var(--my,60%),rgba(255,170,70,.13),rgba(255,120,40,.05) 45%,transparent 70%);mix-blend-mode:screen}
html.q-baja #luz,html.red #luz{display:none}
#app{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column}

/* ---------- barra superior : camino + controles ---------- */
#top{display:flex;align-items:center;gap:1rem;padding:.45rem .9rem;background:linear-gradient(rgba(10,5,30,.85),rgba(10,5,30,.35) 80%,transparent);flex:none}
#camino{position:relative;flex:1;display:flex;align-items:center;min-width:0;max-width:52rem}
.nodo{position:relative;flex:none;display:flex;align-items:center;gap:.4rem;background:none;border:0;padding:.2rem .3rem;border-radius:2rem;cursor:default;color:var(--sua);font-size:.82rem;white-space:nowrap}
.nodo .fl{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,154,31,.45);color:var(--nar2);font-weight:700;font-size:.85rem;background:rgba(18,10,46,.8);transition:all .5s}
.nodo.hecha .fl{background:radial-gradient(circle,#ffcf6b,#ff9a1f 55%,#d96500);border-color:#ffcf6b;color:#3a1500;box-shadow:0 0 14px rgba(255,154,31,.8)}
.nodo.act{color:#fff}.nodo.act .fl{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 18px rgba(255,200,120,.7)}
html.admin .nodo{cursor:pointer}
.pet{flex:1;height:.5rem;min-width:.6rem;background:radial-gradient(circle,rgba(255,154,31,.75) 38%,transparent 42%) 0 50%/.8rem .5rem repeat-x;opacity:.35;transition:opacity .8s}
.pet.hecha{opacity:1;filter:drop-shadow(0 0 4px #ff9a1f)}
#almaP{position:absolute;top:50%;left:0;width:1.5rem;height:1.5rem;margin:-.75rem 0 0 -.75rem;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0,#bff 25%,rgba(34,199,192,.55) 45%,transparent 70%);transform:translate(.75rem,-.6rem);transition:left 1.6s cubic-bezier(.5,0,.2,1);animation:alma 2.4s ease-in-out infinite alternate;z-index:2}
@keyframes alma{from{transform:translate(.75rem,-.45rem) scale(.85);opacity:.8}to{transform:translate(.75rem,-.75rem) scale(1.1);opacity:1}}
#ctl{display:flex;align-items:center;gap:.35rem;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-width:2.5rem;height:2.5rem;padding:0 .6rem;border-radius:.7rem;border:1px solid var(--lin);background:rgba(30,16,70,.7);cursor:pointer;font-size:.85rem;font-weight:600;transition:transform .15s,background .2s,box-shadow .2s}
.ib:hover{background:rgba(70,35,130,.85);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ib:active{transform:translateY(1px) scale(.96)}
.ib[aria-pressed=true]{background:rgba(255,154,31,.22);border-color:var(--nar)}
.ib svg{width:1.25rem;height:1.25rem}
#vol{width:5rem;accent-color:var(--nar);cursor:pointer}
:focus-visible{outline:3px solid var(--tur);outline-offset:2px}

/* ---------- cuerpo ---------- */
#cuerpo{flex:1;display:flex;min-height:0;gap:.8rem;padding:0 .9rem .7rem}
#lado{flex:none;width:13.5rem;display:flex;flex-direction:column;justify-content:space-between;gap:.6rem;transition:width .6s,opacity .6s}
body.sinlado #lado{width:0;opacity:0;overflow:hidden;pointer-events:none}
#info .num{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--nar2)}
#info h2{font-size:1.55rem;line-height:1.15;margin:.15rem 0 .4rem;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#info .hab{font-size:.85rem;color:var(--sua)}
#mini{border:1px solid var(--lin);border-radius:.9rem;background:radial-gradient(ellipse at 50% 100%,rgba(255,154,31,.16),rgba(18,10,46,.75) 70%);padding:.3rem;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#mini .lab{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--nar2);text-align:center}
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto;transition:opacity .35s,transform .35s}
#main.out{opacity:0;transform:translateY(12px) scale(.99)}
.panel{background:var(--pan);border:1px solid var(--lin);border-radius:1.1rem;padding:1rem 1.2rem;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(6px)}
html.q-baja .panel{backdrop-filter:none}
.consigna{display:flex;align-items:center;gap:.6rem;font-size:1.12rem;font-weight:600;margin-bottom:.7rem}
.consigna>svg{flex:none;width:1.7rem;height:1.7rem;color:var(--nar2)}
.nota{font-size:.9rem;color:var(--sua)}
.fila{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.centro{margin:auto;max-width:46rem;width:100%;text-align:center}
.centro .consigna{justify-content:center}

/* ---------- botones ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.9rem;padding:.55rem 1.3rem;border-radius:2rem;border:0;cursor:pointer;font-weight:700;font-size:1.02rem;text-decoration:none;color:#2b1000;background:linear-gradient(#ffc45e,#ff9a1f 60%,#e87a00);box-shadow:0 6px 0 #a34d00,0 12px 26px rgba(255,140,20,.35);transition:transform .14s,box-shadow .14s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 0 #a34d00,0 16px 34px rgba(255,140,20,.5)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a34d00,0 4px 10px rgba(255,140,20,.3)}
.btn.grande{font-size:1.3rem;padding:.8rem 2.2rem;min-height:3.6rem}
.btn.sec{color:var(--txt);background:rgba(60,30,120,.75);border:1px solid var(--lin);box-shadow:0 5px 0 rgba(8,4,26,.9)}
.btn.sec:hover{box-shadow:0 7px 0 rgba(8,4,26,.9),0 10px 24px rgba(120,60,220,.35)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.btn svg{width:1.3rem;height:1.3rem}
.aud{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--tur);background:rgba(34,199,192,.14);color:var(--tur);cursor:pointer;display:inline-grid;place-items:center;transition:transform .15s,background .2s}
.aud:hover{background:rgba(34,199,192,.3);transform:scale(1.08)}
.aud svg{width:1.3rem;height:1.3rem}
.habla{animation:habla .7s ease-in-out infinite alternate}
@keyframes habla{to{box-shadow:0 0 0 .5rem rgba(34,199,192,.18),0 0 22px rgba(34,199,192,.6)}}
.mal{animation:mal .45s}
@keyframes mal{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}100%{transform:none}}
.bienp{animation:bienp .6s}
@keyframes bienp{40%{transform:scale(1.07)}100%{transform:none}}
[hidden]{display:none!important}
.altar:not(.t-humo) .humoP{display:none}
.f5:not(.ok) .est svg{opacity:0}.est svg{width:1.1rem;height:1.1rem}
html.resp .f5 .mod[hidden]{display:block!important}

/* ---------- inicio ---------- */
#inicio{flex:1;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;padding:0 3vw}
#inicio .sup{letter-spacing:.3em;text-transform:uppercase;color:var(--nar2);font-size:.9rem}
#inicio h1{font-size:4.3rem;line-height:1.02;margin:.6rem 0 1rem;text-shadow:0 4px 30px rgba(255,120,20,.45),0 2px 0 #3a1200}
#inicio h1 em{font-style:italic;color:var(--nar);display:block}
#inicio .lema{font-size:1.3rem;margin-bottom:.8rem;max-width:30rem}
#inicio .cas{display:flex;align-items:center;gap:.6rem;color:var(--sua);margin-bottom:1.6rem}
#inicio .cas svg{width:1.6rem;height:1.6rem;color:var(--tur)}
#inicio .altarG{filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));animation:flota 6s ease-in-out infinite alternate}
@keyframes flota{to{transform:translateY(-10px)}}

/* ---------- altar ---------- */
.altar{display:block;width:100%;height:auto;overflow:visible}
.altar .it{opacity:0;transform:translateY(-16px);transition:opacity .9s,transform .9s cubic-bezier(.3,1.5,.5,1)}
.altar.t-foto .it-foto,.altar.t-flores .it-flores,.altar.t-velas .it-velas,.altar.t-pan .it-pan,.altar.t-agua .it-agua,.altar.t-sal .it-sal,.altar.t-copal .it-copal,.altar.t-papel .it-papel,.altar.t-calav .it-calav,.altar.t-cruz .it-cruz,.altar.t-guit .it-guit{opacity:1;transform:none}
.altar .gloria{opacity:0;transition:opacity 3s}.altar.t-luz .gloria{opacity:1}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:llama .28s ease-in-out infinite alternate}
.llama.b{animation-duration:.37s}.llama.c{animation-duration:.22s}
@keyframes llama{from{transform:scale(.92,1.06) skewX(-4deg)}to{transform:scale(1.06,.9) skewX(5deg)}}
.halo{animation:halo 1.3s ease-in-out infinite alternate}
@keyframes halo{from{opacity:.55}to{opacity:1}}
.humo{stroke-dasharray:7 9;animation:humo 2.6s linear infinite}
@keyframes humo{from{stroke-dashoffset:0;opacity:.75}to{stroke-dashoffset:-32;opacity:.3}}
.pp{transform-box:fill-box;transform-origin:50% 0;animation:pp 2.2s ease-in-out infinite alternate}
.pp:nth-child(2n){animation-delay:-.7s}.pp:nth-child(3n){animation-delay:-1.3s}
@keyframes pp{from{transform:skewX(-7deg) scaleY(.97)}to{transform:skewX(8deg) scaleY(1.03)}}
.hueso{fill:#f3e9d2;stroke:#1a1030;stroke-width:1.4}
.manga{stroke-width:10;stroke-linecap:round;fill:none}

/* ---------- etapa 1 ---------- */
.puntos{display:flex;gap:.4rem;justify-content:center;margin-bottom:.8rem}
.puntos i{width:.8rem;height:.8rem;border-radius:50%;background:rgba(255,255,255,.18);transition:all .4s}
.puntos i.ok{background:var(--nar);box-shadow:0 0 10px var(--nar)}.puntos i.ya{background:#fff}
.preg{font-size:1.5rem;font-weight:700;margin:.4rem 0 1rem;display:flex;align-items:center;justify-content:center;gap:.8rem}
.opcs{display:grid;gap:.7rem}
.opc{display:flex;align-items:center;gap:.9rem;text-align:left;min-height:3.4rem;padding:.6rem 1.1rem;border-radius:.9rem;border:1px solid var(--lin);background:rgba(50,26,105,.7);cursor:pointer;font-size:1.12rem;transition:transform .15s,background .2s,border-color .2s}
.opc b{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,154,31,.2);color:var(--nar2)}
.opc:hover{transform:translateX(6px);background:rgba(80,42,150,.85);border-color:var(--nar)}
.opc.no{opacity:.38;pointer-events:none;text-decoration:line-through}
.opc.si{background:rgba(34,199,192,.28);border-color:var(--tur);pointer-events:none}
html.resp .opc[data-ok="1"]{outline:2px dashed var(--tur)}

/* ---------- etapas 2 y 3 : fichas ---------- */
.e2{flex:1;display:grid;grid-template-columns:minmax(15rem,.62fr) 1.38fr;gap:.9rem;min-height:0}
.e2 .altarBox{display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 95%,rgba(255,154,31,.2),transparent 65%);border-radius:1rem}
.e2 .der{display:flex;flex-direction:column;min-height:0}
.objs{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.obj{position:relative;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem .35rem .45rem;border-radius:.9rem;border:1px solid var(--lin);background:linear-gradient(160deg,rgba(70,36,140,.85),rgba(28,14,66,.9));cursor:pointer;text-align:center;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.obj:hover{transform:translateY(-4px) rotateX(6deg);border-color:var(--nar);box-shadow:0 14px 26px rgba(0,0,0,.5),0 0 18px rgba(255,154,31,.25)}
.obj svg.ic{width:4.2rem;height:4.2rem}
.obj .nom{font-size:.92rem;font-weight:600;line-height:1.2;min-height:2.2em;display:flex;align-items:center}
.obj .esc{display:flex;gap:.25rem;height:.6rem}
.obj .esc i{width:.55rem;height:.55rem;border-radius:50%;border:1px solid var(--tur)}
.obj .esc i.on{background:var(--tur);box-shadow:0 0 6px var(--tur)}
.obj.oido{border-color:rgba(34,199,192,.6)}
.leer{font-size:.8rem;padding:.15rem .7rem;border-radius:1rem;border:1px solid var(--oro);background:rgba(240,199,94,.14);color:var(--oro);cursor:pointer;font-weight:700}
.leer:hover{background:rgba(240,199,94,.3)}
.frase{font-size:.86rem;line-height:1.3;color:#fff;background:rgba(0,0,0,.35);border-radius:.5rem;padding:.25rem .4rem}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:.7rem}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.1rem;min-height:8.2rem;padding:.4rem .3rem;border-radius:.9rem;border:2px dashed rgba(240,199,94,.45);background:rgba(10,5,30,.5);text-align:center;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.drop svg.ic{width:2.6rem;height:2.6rem}
.drop .sim{font-size:.9rem;font-weight:700;color:var(--oro);line-height:1.15}
.drop.sobre,.drop:hover{background:rgba(255,154,31,.16);border-color:var(--nar)}
.drop.lleno{border-style:solid;border-color:var(--tur);background:rgba(34,199,192,.12);cursor:default}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.drag.sel{outline:3px solid var(--nar);outline-offset:2px;transform:translateY(-4px) scale(1.04);box-shadow:0 0 26px rgba(255,154,31,.6)}
.drag.fija{cursor:default;pointer-events:none;box-shadow:none;background:none;border-color:transparent;padding:.1rem}
.drag.fija svg.ic{width:2.4rem;height:2.4rem}.drag.fija .nom{font-size:.78rem;min-height:0}
.drag.fija .aud{display:none}
.fant{position:fixed;z-index:60;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-4deg) scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.6)}
html.resp [data-sol]::after{content:attr(data-sol);display:block;font-size:.72rem;color:var(--tur);font-weight:700}
.mini-aud{position:absolute;top:.25rem;right:.25rem;width:1.9rem;height:1.9rem}
.mini-aud svg{width:1rem;height:1rem}

.e3{flex:1;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:.9rem;min-height:0}
.col{display:flex;flex-direction:column;align-items:stretch;gap:.4rem;padding:.7rem;border-radius:1.1rem;border:2px dashed rgba(240,199,94,.45);background:rgba(10,5,30,.55);cursor:pointer;transition:background .2s,border-color .2s;min-height:0}
.col.sobre,.col:hover{background:rgba(255,154,31,.13);border-color:var(--nar)}
.col h3{font-size:1.2rem;text-align:center;line-height:1.15}
.col .cab svg{width:4.2rem;height:4.2rem;display:block;margin:0 auto}
.col.pre h3{color:var(--nar2)}.col.cat h3{color:var(--tur)}
.col .lista{display:flex;flex-direction:column;gap:.35rem}
.cartas{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;align-content:start;perspective:900px}
.carta{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.6rem .35rem;border-radius:.9rem;border:1px solid var(--oro);background:linear-gradient(155deg,#4a2590,#1f0f48);box-shadow:0 10px 22px rgba(0,0,0,.5);text-align:center;font-weight:600;font-size:.92rem;line-height:1.2;min-height:8.6rem;transform-style:preserve-3d;transition:transform .35s,box-shadow .3s;animation:reparte .7s backwards cubic-bezier(.3,1.3,.5,1)}
.carta:hover{transform:rotateY(-12deg) rotateX(8deg) translateY(-5px);box-shadow:14px 18px 30px rgba(0,0,0,.55),0 0 18px rgba(240,199,94,.3)}
.carta svg.ic{width:3.8rem;height:3.8rem}
@keyframes reparte{from{transform:rotateY(180deg) translateY(40px) scale(.6);opacity:0}}
.carta.fija{flex-direction:row;min-height:0;padding:.25rem .5rem;font-size:.82rem;text-align:left;animation:bienp .5s;pointer-events:none;border-color:transparent;box-shadow:none;background:rgba(255,255,255,.07)}
.carta.fija svg.ic{width:2rem;height:2rem;flex:none}
.bilan{grid-column:1/-1;text-align:center;font-size:1.6rem;padding:.8rem;animation:bienp .7s}
.bilan b{color:var(--nar)}

/* ---------- etapa 4 ---------- */
.e4{flex:1;display:flex;flex-direction:column;min-height:0;gap:.5rem}
.escBox{flex:1;min-height:0;display:flex;justify-content:center}
#escena{height:100%;width:100%;max-width:100%;filter:drop-shadow(0 16px 30px rgba(0,0,0,.6))}
.pj{cursor:pointer;outline:none}
.pj .hit{fill:transparent}
.pj:not(.vivo) [fill]:not(.k):not(.hit):not([fill=none]){fill:#514478}
.pj:not(.vivo) .hueso{fill:#9d92bd!important}
.pj:not(.vivo) [stroke]:not(.k){stroke:#2c2250}
.pj:not(.vivo) .manga{stroke:#514478}
.pj:not(.vivo) .solo-vivo{display:none}
.pj .marca{animation:marca 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes marca{from{transform:scale(.8);opacity:.7}to{transform:scale(1.15);opacity:1}}
.pj.vivo .marca{display:none}
.pj:not(.vivo):hover [fill]:not(.k):not(.hit):not([fill=none]),.pj.elegido:not(.vivo) [fill]:not(.k):not(.hit):not([fill=none]),.pj:not(.vivo):focus-visible [fill]:not(.k):not(.hit):not([fill=none]){fill:#7868ad}
.pj.elegido .hit,.pj:focus-visible .hit{stroke:#ffcf6b!important;stroke-width:3;stroke-dasharray:8 6;rx:14}
.an{transform-origin:0px 0px}
.vivo .sw{animation:sw var(--d,.6s) ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(var(--f,0deg))}to{transform:rotate(var(--t,0deg))}}
.vivo .bob{animation:bob var(--d,.5s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translate(0,0) rotate(calc(var(--br,0deg)*-1))}to{transform:translate(var(--bx,0px),var(--by,-4px)) rotate(var(--br,0deg))}}
.vivo .boca{animation:boca .35s ease-in-out infinite alternate;transform-origin:0px 17px}
@keyframes boca{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
.vivo .nt{animation:nt 2.2s linear infinite}
.nt{opacity:0}.nt.b{animation-delay:-1.1s!important}
@keyframes nt{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(14px,-70px) rotate(20deg);opacity:0}}
.bruma{animation:bruma 26s linear infinite alternate}
@keyframes bruma{to{transform:translateX(-140px)}}
.velo{transition:opacity 1.2s}
.escr{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.6rem 1rem;min-height:5.2rem}
.inf{display:flex;flex-direction:column;align-items:center;padding:.3rem 1rem;border-radius:.8rem;background:rgba(224,33,138,.2);border:1px solid var(--mag);min-width:9rem}
.inf b{font-size:1.25rem;color:#fff}.inf small{font-size:.8rem;color:var(--sua)}
.oracion{display:flex;align-items:center;gap:.5rem;font-size:1.25rem;font-weight:600;flex-wrap:wrap}
.oracion input,.f5 input{min-width:13rem;padding:.4rem .7rem;border-radius:.6rem;border:2px solid var(--oro);background:rgba(0,0,0,.4);font-size:1.15rem;font-weight:600;caret-color:var(--nar)}
.oracion input:focus,.f5 input:focus{outline:none;border-color:var(--nar);box-shadow:0 0 0 4px rgba(255,154,31,.22)}

  const arco = Array.from({ length: 17 }, (_, i) => { const a = Math.PI * (1 - i / 16), x = 200 + Math.cos(a) * 178, y = 205 - Math.sin(a) * 178; return flor(R(x), R(y), i % 2 ? 9 : 11); }).join('');
  return `<svg class="altar ${t}" viewBox="0 0 400 360" role="img" aria-label="El altar">

/* ---- La fresque de l'étape 4 : cimetière en fête ---- */
function escenaSVG() {
  let rnd = 7; const rd = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
  const estr = Array.from({ length: 70 }, () => `<circle cx="${R(40 + rd() * 1520)}" cy="${R(160 + rd() * 200)}" r="${R(.6 + rd() * 1.6)}" fill="#fff" opacity="${R(.3 + rd() * .7)}"/>`).join('');
  const tumbaS = (x, y, s, tipo) => `<g transform="translate(${x},${y}) scale(${s})">${tipo ? `<path d="M-14,0V-30Q-14,-44 0,-44Q14,-44 14,-30V0Z" fill="#4b3d78" stroke="#1a1030"/><path d="M0,-36V-16M-7,-29H7" stroke="#a79bd0" stroke-width="3"/>` : `<path d="M0,0V-48M-13,-34H13" stroke="#6b5c9c" stroke-width="7" stroke-linecap="round"/>`}<circle cx="18" cy="-10" r="16" fill="url(#gHalo)" class="halo"/><rect x="16" y="-12" width="4" height="12" fill="#f6ead0"/><circle cx="18" cy="-15" r="2.500" fill="#ffd27a"/>${flor(-16, -4, 6)}</g>`;
  const fondoT = [[90,470,.8,1],[210,462,.7,0],[330,474,.85,1],[470,462,.7,0],[1090,466,.75,1],[1180,474,.8,0],[1480,470,.85,1],[1540,484,.9,0],[560,476,.7,1],[1010,478,.7,0]].map(a => tumbaS(...a)).join('');
  const ppLinea = (y, sag, n, s) => `<path d="M20,${y}Q800,${y + sag * 2} 1580,${y}" stroke="#f3e9d2" stroke-width="1.500" fill="none" opacity=".8"/>` + Array.from({ length: n }, (_, i) => { const u = (i + .5) / n, x = 20 + 1560 * u - 13 * s, yy = y + sag * 4 * u * (1 - u) * .5 * 2 * .5 + sag * 2 * u * (1 - u); return bandera(R(x), R(yy), ['#e0218a','#22c7c0','#ff9a1f','#f0c75e','#8a3fd0'][i % 5], s); }).join('');
  const P = {};

  { const de = document.documentElement, pide = de.requestFullscreen || de.webkitRequestFullscreen, sale = document.exitFullscreen || document.webkitExitFullscreen,

    if (pide && sale && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
