<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La plaza de Navidad</title>
<style>
@font-face{font-family:Atkinson;src:url(vendor/fonts/AtkinsonHyperlegible-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Atkinson;src:url(vendor/fonts/AtkinsonHyperlegible-Bold.ttf);font-weight:700;font-display:swap}
:root{--noche:#0b1122;--noche2:#141d3a;--azul:#1c2850;--marfil:#f4ecdc;--papel:#fbf6ea;--oro:#d2a94a;--oro2:#f3cf78;--rojo:#a4142c;--rojo2:#c9233f;--verde:#1f6b4a;--tinta:#22190f;--gris:#8b8271}
*{box-sizing:border-box}
/* tout est dimensionné en rem : l'ensemble se réduit pour tenir dans l'écran */
html{font-size:clamp(10px,min(1.14vw,2.03vh),24px)}
body{margin:0;height:100vh;overflow:hidden;background:var(--noche);color:var(--marfil);font-family:Atkinson,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.4;user-select:none}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
.serif{font-family:Georgia,"Times New Roman",serif}
.ver{font-variant:small-caps;letter-spacing:.14em;font-size:.8rem;color:var(--oro)}

/* ---------- la plaza (una sola pantalla) ---------- */
#plaza{position:fixed;inset:0}
#plaza svg{width:100%;height:100%;display:block}
.lugar{cursor:pointer;outline:none}
.lugar .m{fill:#17224a;stroke:var(--oro);stroke-width:1.6;stroke-opacity:.55;transition:all .3s}
.lugar .v{fill:#0c1430;transition:fill .8s}
.lugar .l{stroke:var(--oro);stroke-width:1.4;fill:none;stroke-opacity:.6}
.lugar:hover .m,.lugar:focus .m{fill:#22326a;stroke-opacity:1}
.lugar.hecho .v{fill:var(--oro2);filter:url(#luz)}
.lugar.hecho .m{fill:#1d2b5c;stroke-opacity:1}
.lugar .nom{fill:var(--marfil);font-size:21px;font-weight:700;letter-spacing:.12em;text-anchor:middle}
.lugar .fec{fill:var(--oro);font-size:15px;text-anchor:middle;letter-spacing:.06em}
.lugar.cerrado{opacity:.45}
.lugar .foco{fill:none;stroke:var(--oro2);stroke-width:2;stroke-dasharray:5 7;opacity:0}
.lugar:hover .foco{opacity:.9;animation:gira 14s linear infinite}
@keyframes gira{to{stroke-dashoffset:-240}}
.bomb{fill:#2a3559;transition:fill .8s}
.bomb.on{filter:url(#luz)}
.nodo circle{fill:#141d3a;stroke:var(--oro);stroke-width:1.5;transition:fill .8s}
.nodo text{fill:var(--gris);text-anchor:middle;transition:fill .8s}
.nodo .n{font-size:20px;font-weight:700}
.nodo .t{font-size:13px;letter-spacing:.05em}
.nodo.on circle{fill:var(--oro2);filter:url(#luz)}
.nodo.on .n{fill:var(--tinta)}
.nodo.on .t{fill:var(--marfil)}
#mono{cursor:pointer;transform-origin:775px 590px;animation:pend 4s ease-in-out infinite}
@keyframes pend{50%{transform:rotate(5deg)}}
#cab{position:fixed;top:1rem;left:1.6rem;right:1.6rem;display:flex;align-items:baseline;gap:1.2rem;pointer-events:none}
#cab h1{font-size:1.7rem;font-style:italic;font-weight:400;color:var(--marfil)}
#cab .sp{flex:1}
#cab button{pointer-events:auto;background:none;border:1px solid var(--oro);color:var(--oro2);border-radius:.3rem;padding:.25rem .8rem;cursor:pointer;font-size:.85rem;letter-spacing:.06em}
#cab button:hover{background:rgba(210,169,74,.15)}

/* ---------- escena de ejercicio: pantalla completa, sin desplazamiento ---------- */
#esc{position:fixed;inset:0;z-index:10;display:none;grid-template:4.4rem 1fr/25rem 1fr;background:radial-gradient(ellipse at 70% 0,#1c2850,#0b1122 70%)}
#esc.on{display:grid}
#esc>header{grid-column:1/-1;display:flex;align-items:center;gap:1.6rem;padding:0 1.6rem;border-bottom:1px solid rgba(210,169,74,.4)}
#esc>header h2{font-size:1.55rem;font-style:italic;font-weight:400}
.pasos{display:flex;gap:.5rem;list-style:none;flex:1}
.pasos li{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);padding:.2rem .7rem;border:1px solid transparent;border-radius:.3rem}
.pasos li.act{color:var(--oro2);border-color:var(--oro)}
.pasos li.ya{color:var(--marfil)}
.pasos li.ya::before{content:"✓ ";color:var(--oro2)}
.salir{background:none;border:1px solid var(--gris);color:var(--marfil);border-radius:.3rem;padding:.3rem .9rem;cursor:pointer;font-size:.85rem}
#esc aside{background:var(--papel);color:var(--tinta);padding:1.4rem 1.4rem 1.2rem;display:flex;flex-direction:column;gap:.8rem;border-right:.25rem solid var(--rojo);overflow:hidden}
.cons{font-size:1.12rem;font-weight:700;line-height:1.35}
.cons .fr{display:none;font-weight:400;font-style:italic;color:#6b6252;font-size:.95rem;margin-top:.5rem}
.cons.ver2 .fr{display:block}
.ut{display:flex;gap:.5rem}
.mini{background:none;border:1px solid #b9ab8e;border-radius:.3rem;padding:.15rem .6rem;cursor:pointer;font-size:.82rem;color:#4a4132}
.mini:hover,.mini.habla{background:var(--oro2)}
.glos{font-size:.9rem;color:#5d5444;border-top:1px solid #dccfb4;padding-top:.7rem}
.glos b{color:var(--tinta)}
.glos li{margin-left:1.1rem;margin-bottom:.25rem}
.msg{margin-top:auto;font-weight:700;min-height:2.8em;font-size:1rem}
.msg.bien{color:var(--verde)}.msg.mal{color:var(--rojo)}
.btn{background:var(--rojo);color:#fff;border:0;border-radius:.3rem;padding:.7rem 1.4rem;font-weight:700;cursor:pointer;letter-spacing:.04em;width:100%}
.btn:hover{background:var(--rojo2)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.oro{background:var(--oro);color:var(--tinta)}
#tabla{position:relative;padding:1.4rem 2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;overflow:hidden}

/* fichas y destinos (arrastrar y soltar) */
.ficha{background:var(--marfil);color:var(--tinta);border:1px solid var(--oro);border-radius:.3rem;padding:.4rem .9rem;font-weight:700;cursor:grab;touch-action:none;position:relative;transition:box-shadow .2s;white-space:nowrap}
.ficha:hover,.ficha.sel{box-shadow:0 0 0 .18rem var(--oro2)}
.ficha.vuela{z-index:50;cursor:grabbing;box-shadow:0 .6rem 1.4rem rgba(0,0,0,.5);transition:none}
.ficha.no{animation:no .35s}
@keyframes no{25%{translate:-.4rem 0}75%{translate:.4rem 0}}
.ficha.fija{cursor:default;background:var(--oro2);box-shadow:none;animation:pop .35s}
@keyframes pop{50%{scale:1.12}}
.bandeja{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;min-height:2.6rem;max-width:56rem}
.dest{transition:all .2s}
.dest.sobre{outline:.15rem dashed var(--oro2);outline-offset:.15rem}
.caja{border:1px dashed rgba(210,169,74,.7);border-radius:.4rem;min-height:2.8rem;min-width:9rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;padding:.3rem;color:var(--gris);font-size:.85rem}
.caja.lleno{border-style:solid;background:rgba(243,207,120,.08)}
.rot{font-variant:small-caps;letter-spacing:.12em;color:var(--oro2);font-size:.95rem}

/* lotería */
.duo{display:grid;grid-template-columns:34rem 1fr;gap:2rem;align-items:center;width:100%}
video{width:100%;border:1px solid var(--oro);border-radius:.3rem;background:#000;display:block}
.bombo{display:flex;flex-direction:column;gap:1.1rem}
.ruedas{display:flex;gap:.35rem;align-items:center}
.rueda{display:flex;flex-direction:column;align-items:center}
.rueda button{background:none;border:0;color:var(--oro);cursor:pointer;font-size:1rem;padding:.1rem .6rem}
.rueda span{width:3rem;height:3.6rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7e0,#d9c08a);color:var(--tinta);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;font-family:Georgia,serif;transition:transform .25s}
.rueda span.gira{transform:rotateX(360deg)}
.ruedas i{font-size:2rem;color:var(--oro2);font-style:normal}
.elige{display:flex;flex-wrap:wrap;gap:.5rem}
.op{background:none;border:1px solid var(--oro);color:inherit;border-radius:.3rem;padding:.4rem .9rem;cursor:pointer;font-weight:700}
.op:hover{background:rgba(210,169,74,.15)}
.op.sel{background:var(--marfil);color:var(--tinta)}
.op.ok{background:var(--oro2);color:var(--tinta);border-color:var(--oro2)}
.op.ko{opacity:.35;text-decoration:line-through;cursor:default}
.grupo.mal .rot{color:#ff8a9a}
.preg{margin-bottom:1rem}
.preg p{font-weight:700;margin-bottom:.4rem}
/* calendario */
.hilo{display:grid;grid-template-columns:repeat(8,6.6rem);gap:.5rem;position:relative;padding-top:1.4rem}
.hilo::before{content:"";position:absolute;left:1rem;right:1rem;top:2rem;border-top:1px solid var(--oro)}
.hilo .pos{display:flex;flex-direction:column;align-items:center;gap:.5rem;position:relative}
.hilo .bu{width:1.3rem;height:1.3rem;border-radius:50%;background:#2a3559;border:1px solid var(--oro);transition:all .5s}
.hilo .pos.on .bu{background:var(--oro2);box-shadow:0 0 1.2rem var(--oro2)}
.hilo .dia{font-family:Georgia,serif;font-size:1.5rem;text-align:center}
.hilo .dia small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);font-family:Atkinson,sans-serif}
.hilo .caja{min-width:0;width:100%;min-height:4.2rem}
.hilo .ficha,.bandeja.peq .ficha{white-space:normal;text-align:center;font-size:.85rem;padding:.3rem .4rem}
/* belén */
#establo{width:44rem;height:25rem}
#establo .fig{fill:#1b2750;stroke:var(--oro);stroke-width:1.5;stroke-opacity:.6;transition:fill .6s}
#establo .dest.on .fig{fill:var(--oro2)}
#establo .dest.sobre .fig{stroke-opacity:1;stroke-width:3}
#establo .dest text{fill:var(--marfil);font-size:15px;text-anchor:middle;opacity:0;transition:opacity .6s;font-weight:700}
#establo .dest.on text{opacity:1}
#establo .astro{fill:#2a3559;transition:all 1s}
#establo.fin .astro{fill:var(--oro2);filter:drop-shadow(0 0 12px #f3cf78)}
.fuera{min-width:14rem}
.def{font-family:Georgia,serif;font-size:1.45rem;line-height:2.5;max-width:54rem;text-align:center}
.def .dest{display:inline-flex;min-width:9rem;min-height:2.3rem;border-bottom:1px solid var(--oro);vertical-align:middle;justify-content:center;align-items:center;margin:0 .2rem}
.def .ficha{font-family:Atkinson,sans-serif;font-size:1rem;line-height:1.3}
.campanas{display:flex;gap:1.1rem;align-items:flex-end}
.camp{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--gris);font-size:.85rem}
.camp svg{width:5.2rem;height:6rem;fill:#3a3320;stroke:var(--oro);stroke-width:2;transition:fill .15s}
.camp.luz svg{fill:var(--oro2);filter:drop-shadow(0 0 .8rem var(--oro2))}
.camp.luz{color:var(--oro2)}
.camp.toca svg{animation:bal .4s}
@keyframes bal{30%{transform:rotate(-9deg)}70%{transform:rotate(7deg)}}
.pauta{display:flex;gap:.3rem}
.pauta i{width:.7rem;height:.7rem;border-radius:50%;background:#2a3559}
.pauta i.ya{background:var(--oro2)}
/* cena */
.mesa{position:relative;width:50rem;height:15rem;border-radius:50%;background:radial-gradient(ellipse,#8e1227,#5d0c1a);border:.3rem solid #3d0711;box-shadow:0 1.5rem 3rem rgba(0,0,0,.5)}
.mesa .plato{position:absolute;width:8.6rem;height:8.6rem;border-radius:50%;background:radial-gradient(circle,#fbf6ea 58%,#e3d6ba 60%,#fbf6ea 70%);translate:-50% -50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;color:var(--gris);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.mesa .plato .ficha{white-space:normal;font-size:.85rem;text-transform:none;letter-spacing:0;border:0;background:none;padding:0 1.2rem}
.mesa .plato.lleno{box-shadow:0 0 1.5rem var(--oro2)}
.verbo{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 2.4rem}
.pers{display:flex;align-items:center;gap:.5rem;border:1px solid transparent;border-radius:.4rem;padding:.45rem .9rem;transition:all .6s}
.pers .pr{width:10.5rem;color:var(--gris);font-size:.95rem}
.pers .fo{font-family:Georgia,serif;font-size:1.9rem;display:flex;align-items:center}
.raiz{background:var(--azul);border:1px solid var(--oro);color:var(--oro2);border-radius:.3rem;cursor:pointer;font-family:Georgia,serif;font-size:1.7rem;min-width:3.4rem;margin:0 .15rem;padding:0 .3rem;transition:scale .15s}
.raiz:active{scale:.85}
.pers .caja{min-width:5rem;min-height:2.5rem;margin-left:.2rem}
.pers .caja .ficha{font-family:Georgia,serif;font-size:1.3rem;padding:.1rem .5rem}
.pers.bota{border-color:var(--oro2);background:rgba(243,207,120,.1)}
.pers.mal .raiz{border-color:#ff8a9a;color:#ff8a9a}
.tarjeta{width:46rem;background:var(--papel);color:var(--tinta);border-radius:.4rem;padding:2.2rem 2rem 1.6rem;text-align:center;border-top:.3rem solid var(--rojo)}
.tarjeta p{font-family:Georgia,serif;font-size:1.7rem;min-height:4.6rem}
.tarjeta u{text-decoration:none;border-bottom:.15rem solid var(--rojo);padding:0 1.6rem;color:var(--rojo)}
.mecha{height:.35rem;background:#e2d5ba;border-radius:.2rem;margin:1.2rem 0;overflow:hidden}
.mecha i{display:block;height:100%;background:var(--rojo);width:100%}
.dosb{display:flex;gap:1.2rem;justify-content:center}
.dosb button{flex:1;max-width:14rem;font-family:Georgia,serif;font-size:1.5rem;padding:.7rem;border:1px solid var(--tinta);background:#fff;border-radius:.3rem;cursor:pointer;color:var(--tinta)}
.dosb button:hover{background:var(--oro2)}
.dosb small{display:block;font-family:Atkinson,sans-serif;font-size:.7rem;color:var(--gris)}
/* reloj */
.esfera{position:relative;width:52rem;height:28rem}
.esfera svg{position:absolute;left:50%;top:46%;translate:-50% -50%;width:14rem;height:14rem}
.esfera .q{position:absolute;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.esfera .q .caja{min-width:17rem}
#reloj{width:11rem;height:11rem}
#reloj.dong{animation:dong .5s}
@keyframes dong{20%{transform:scale(1.1) rotate(-3deg)}60%{transform:rotate(3deg)}}
#uvas{display:grid;grid-template-columns:repeat(12,4.3rem);gap:.3rem}
#uvas div{text-align:center;font-size:.72rem;color:var(--gris);letter-spacing:.04em}
#uvas span{display:block;width:2.4rem;height:2.7rem;margin:0 auto .4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9e8a0,#7fa23a);transition:all .3s}
#uvas .act span{transform:scale(1.35);box-shadow:0 0 1.4rem var(--oro2)}
#uvas .act{color:var(--oro2)}
#uvas .com span{transform:scale(.25);opacity:.4}
#uvas .com{color:var(--marfil)}
#uvas .per span{background:#3b4259}
#comer{width:22rem;font-size:1.2rem;padding:1rem}
/* cabalgata */
.calle{position:relative;width:100%;height:24rem;border-top:1px solid rgba(210,169,74,.4);border-bottom:.3rem solid #3a3320;overflow:hidden;background:linear-gradient(#0b1122,#1c2850)}
.carroza{position:absolute;bottom:0;width:15rem;animation:pasa 26s linear infinite}
.carroza svg{width:100%;display:block}
.carroza .caja{position:absolute;left:50%;bottom:1.2rem;translate:-50% 0;background:rgba(11,17,34,.8)}
@keyframes pasa{from{left:100%}to{left:-16rem}}
.calle:hover .carroza{animation-play-state:paused}
#lluvia{position:relative;width:100%;height:27rem;border:1px solid rgba(210,169,74,.4);border-radius:.4rem;overflow:hidden;background:linear-gradient(#0b1122,#1c2850)}
#lluvia .car{position:absolute;top:-3rem;background:var(--marfil);color:var(--tinta);border:0;border-radius:.3rem;padding:.35rem 1rem;font-weight:700;cursor:pointer;animation:cae 6.5s linear forwards;white-space:nowrap}
#lluvia .car::before,#lluvia .car::after{content:"";position:absolute;top:50%;border:.55rem solid transparent;translate:0 -50%}
#lluvia .car::before{right:100%;border-right-color:var(--rojo2)}
#lluvia .car::after{left:100%;border-left-color:var(--rojo2)}
@keyframes cae{to{top:105%}}
#lluvia .car.ok{background:var(--oro2);animation-play-state:paused;opacity:0;transition:opacity .5s}
#lluvia .car.ko{background:#ff8a9a;animation-play-state:paused;opacity:0;transition:opacity .8s}
.marc{display:flex;gap:3rem;font-size:1.1rem}
.marc b{color:var(--oro2);font-family:Georgia,serif;font-size:1.5rem}
.hoja{width:44rem;background:var(--papel);color:var(--tinta);border-radius:.3rem;padding:1.2rem 1.6rem;box-shadow:0 1.5rem 3rem rgba(0,0,0,.5);transition:all .9s}
.hoja.va{transform:translate(30rem,-30rem) rotate(25deg) scale(.1);opacity:0}
.hoja textarea{width:100%;height:13rem;border:0;background:repeating-linear-gradient(transparent 0 1.95rem,#dccfb4 1.95rem 2rem);line-height:2rem;font-family:Georgia,serif;font-size:1.15rem;resize:none;outline:none;user-select:text;color:var(--tinta)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.chips button{background:none;border:1px solid #b9ab8e;border-radius:.3rem;padding:.1rem .5rem;cursor:pointer;font-size:.85rem;color:#4a4132}
.chips button:hover{background:var(--oro2)}
.chips .ac{font-weight:700;min-width:1.8rem}
.cuenta{font-size:.8rem;color:var(--gris);text-align:right}
/* café */
.venn{position:relative;width:54rem;height:21rem}
.venn .c{position:absolute;top:0;width:32rem;height:21rem;border-radius:50%;border:1px solid var(--oro)}
.venn .c.e{left:0;background:rgba(201,35,63,.16)}
.venn .c.f{right:0;background:rgba(60,110,200,.16)}
.venn .z{position:absolute;top:1.6rem;bottom:1.6rem;display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:.35rem;border:0;min-width:0}
.venn .z.lleno{background:none}
.venn .z .ficha{font-size:.82rem;padding:.25rem .5rem;white-space:normal;text-align:center}
.frases{font-family:Georgia,serif;font-size:1.2rem;line-height:2.5;max-width:56rem}
.frases .dest{display:inline-flex;min-width:8.5rem;min-height:2.1rem;border-bottom:1px solid var(--oro);vertical-align:middle;justify-content:center;margin:0 .2rem}
.frases .ficha{font-family:Atkinson,sans-serif;font-size:.95rem;line-height:1.3}

/* ventanas (portada, final, avisos) */
#velo{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,22,.82)}
#velo.on{display:flex}
.vent{background:var(--papel);color:var(--tinta);border-top:.35rem solid var(--rojo);border-radius:.3rem;padding:2.2rem 2.6rem;width:min(44rem,92vw);text-align:center;box-shadow:0 2rem 5rem rgba(0,0,0,.6);user-select:text}
.vent h1{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:3rem;line-height:1.15}
.vent h1 em{color:var(--rojo);font-style:italic}
.vent h2{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:1.9rem;margin-bottom:.8rem}
.vent p{margin:.8rem auto;max-width:34rem}
.vent .fr{color:#6b6252;font-style:italic;font-size:.92rem}
.vent input{border:0;border-bottom:1px solid var(--tinta);background:none;text-align:center;font-family:Georgia,serif;font-size:1.3rem;padding:.3rem;width:16rem;outline:none;user-select:text}
.vent .btn{width:auto;min-width:11rem;margin:.2rem}
.vent .btn.sec{background:none;color:var(--rojo);border:1px solid var(--rojo)}
.vent .op{border-color:var(--tinta)}
.filete{height:1px;background:var(--oro);margin:1rem auto;width:10rem}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1rem 0}
.res div{border:1px solid #dccfb4;border-radius:.3rem;padding:.4rem;font-size:.85rem}
.res b{display:block;font-family:Georgia,serif;font-size:1.3rem;color:var(--rojo)}
#fuegos{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important}}
</style>
</head>
<body>
<div id="plaza"></div>
<div id="cab"><h1 class="serif">La plaza de Navidad</h1><span class="ver" id="quien"></span><span class="sp"></span><button id="bson"></button><button id="bayuda">Ayuda</button></div>
<div id="esc"><header><div><div class="ver" id="efec"></div><h2 class="serif" id="etit"></h2></div><ol class="pasos" id="epasos"></ol><button class="salir" id="esalir">Volver a la plaza</button></header>
<aside><div class="cons" id="econs"></div><div class="ut"><button class="mini" id="evoz">Escuchar</button><button class="mini" id="efr">En français</button></div><div class="glos" id="eglos"></div><div class="msg" id="emsg"></div><div id="ebt"></div></aside>

<script>
/* =====================================================================
   LA PLAZA DE NAVIDAD — juego de repaso (3e, A1+)
   ---------------------------------------------------------------------
   RÉGLAGES PROFESSEUR
   - VIDEOS : chemins des vidéos. cabalgata : null pour l'instant ;
     indiquer un fichier (ex. 'videos/navidad-cabalgata.mp4') pour
     ajouter une étape vidéo au début de « La cabalgata de Reyes ».
   - CODIGO_ADMIN : code du mode professeur (Ctrl+Maj+A ou #profe).
   ===================================================================== */
const VIDEOS = { gordo: 'videos/navidad-gordo-2025.mp4', tradiciones: 'videos/navidad-tradiciones.mp4', cabalgata: null };
const PREGUNTAS_CABALGATA = [
  { p: '¿Quiénes desfilan?', o: ['Los Reyes Magos', 'Papá Noel y sus renos', 'Los niños de San Ildefonso'], c: 0 },
  { p: '¿Qué reparten a los niños?', o: ['Caramelos', 'Uvas', 'Turrones'], c: 0 }
];
const CODIGO_ADMIN = 'profe';
const CLAVE = 'plaza-navidad-v2';

/* ====== 1. ESTADO ==================================================== */
const base = () => ({ v: 2, nombre: '', hecho: {}, pts: {}, carta: '', comp: '', son: 1 });
let S = base();
try { const r = JSON.parse(localStorage.getItem(CLAVE)); if (r && r.v === 2) S = Object.assign(base(), r); } catch (e) {}
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const baraja = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const FECHAS = [
  { n: '22', m: 'dic', t: 'El Gordo', est: 'loteria', x: 150 }, { n: '24', m: 'dic', t: 'Nochebuena', est: 'cena', x: 400 },
  { n: '25', m: 'dic', t: 'Navidad', est: 'belen', x: 650 }, { n: '28', m: 'dic', t: 'Inocentes', est: 'inocente', x: 775 },
  { n: '31', m: 'dic', t: 'Nochevieja', est: 'reloj', x: 862 }, { n: '1', m: 'ene', t: 'Año Nuevo', est: 'reloj', x: 948 },
  { n: '5', m: 'ene', t: 'Cabalgata', est: 'reyes', x: 1112 }, { n: '6', m: 'ene', t: 'Reyes', est: 'reyes', x: 1208 }
];
const LUGARES = [
  { id: 'loteria', x: 150, t: 'LA LOTERÍA', f: '22 de diciembre' }, { id: 'cena', x: 400, t: 'LA CENA', f: 'Nochebuena' },
  { id: 'belen', x: 650, t: 'EL BELÉN', f: 'Navidad' }, { id: 'reloj', x: 900, t: 'EL RELOJ', f: 'Nochevieja' },
  { id: 'reyes', x: 1160, t: 'LA CABALGATA', f: 'Día de Reyes' }, { id: 'cafe', x: 1420, t: 'EL CAFÉ', f: 'España y Francia' }
];
const cincoHechos = () => ['loteria', 'belen', 'cena', 'reloj', 'reyes'].every(k => S.hecho[k]);

/* ====== 2. SONIDO (todo sintetizado, sin archivos) ==================== */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tono(f, t, d, tipo = 'sine', v = .2) {
  const a = ac(); if (!a || !S.son) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function campana(f = 196, v = .28) { const a = ac(); if (!a) return; const t = a.currentTime; [[.5, 1, 3.2], [1, .9, 2.6], [1.19, .55, 2], [1.5, .4, 1.6], [2, .5, 1.3], [2.51, .3, 1], [3.01, .2, .8], [4.1, .12, .5]].forEach(([m, g, d]) => tono(f * m, t, d, 'sine', v * g)); }
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
function nota(midi, t, d) { const f = hz(midi); tono(f, t, Math.max(.6, d * 1.7), 'sine', .22); tono(f * 2, t, d * .9, 'sine', .07); tono(f * 3.01, t, d * .5, 'sine', .04); }
const ahora = () => { const a = ac(); return a ? a.currentTime : 0; };
const bien = () => { const t = ahora(); tono(784, t, .18, 'triangle', .13); tono(1175, t + .1, .3, 'triangle', .13); };
const mal = () => tono(150, ahora(), .28, 'sawtooth', .07);
const clic = (k = 0) => tono(520 + (k % 12) * 40, ahora(), .12, 'triangle', .12);
/* Villancicos tradicionales (dominio público), en do mayor: [nota MIDI, tiempos] */
const MELODIAS = {
  paz: { bpm: 104, n: [[67,1.5],[69,.5],[67,1],[64,3],[67,1.5],[69,.5],[67,1],[64,3],[74,2],[74,1],[71,3],[72,2],[72,1],[67,3]] },
  cascabel: { bpm: 176, n: [[64,1],[64,1],[64,2],[64,1],[64,1],[64,2],[64,1],[67,1],[60,1.5],[62,.5],[64,4],[65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5],[67,1],[67,1],[65,1],[62,1],[60,4]] }
};
let melodiaFin = 0;
function tocar(id) { const a = ac(); if (!a) return 0; const m = MELODIAS[id], b = 60 / m.bpm; let t = Math.max(a.currentTime + .05, melodiaFin + .2); m.n.forEach(([n, d]) => { nota(n, t, d * b); t += d * b; }); melodiaFin = t; return (t - a.currentTime) * 1000; }
let VOCES = [];
function cargarVoces() { try { VOCES = speechSynthesis.getVoices().filter(v => /^es([-_]|$)/i.test(v.lang)); VOCES.sort((a, b) => (/es[-_]ES/i.test(b.lang) - /es[-_]ES/i.test(a.lang))); } catch (e) {} }
if ('speechSynthesis' in window) { cargarVoces(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', cargarVoces); }
function decir(txt, btn) {
  if (!('speechSynthesis' in window) || !S.son) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g, ' ').replace(/_+/g, '...')); u.lang = 'es-ES'; if (VOCES[0]) u.voice = VOCES[0]; u.rate = .85;
    if (btn) { btn.classList.add('habla'); u.onend = u.onerror = () => btn.classList.remove('habla'); } speechSynthesis.speak(u); } catch (e) {}
}
const callar = () => { try { speechSynthesis.cancel(); } catch (e) {} };

/* ====== 3. LA PLAZA: una sola pantalla, de noche; lo terminado se ilumina */
function ventanas(x, y, cols, filas, w, h, dx, dy) { let s = ''; for (let f = 0; f < filas; f++) for (let c = 0; c < cols; c++) s += `<rect class="v" x="${x + c * dx}" y="${y + f * dy}" width="${w}" height="${h}"/>`; return s; }
const corona = (x, y, e = 1) => `<path class="v" transform="translate(${x} ${y}) scale(${e})" d="M-14 0l-3-20 9 9 8-15 8 15 9-9-3 20z"/>`;
const EDIF = {
  loteria: `<path class="m" d="M60 700V470l90-60 90 60v230z"/><path class="l" d="M60 470h180M60 690h180"/><rect class="m" x="92" y="478" width="116" height="28"/><text x="150" y="498" text-anchor="middle" font-size="15" letter-spacing="3" fill="#d2a94a">LOTERÍA</text>${ventanas(86, 530, 4, 1, 24, 120, 35, 0)}<circle class="v" cx="150" cy="445" r="11"/>`,
  cena: `<path class="m" d="M320 700V385l80-62 80 62v315z"/><rect class="m" x="438" y="320" width="18" height="46"/>${ventanas(345, 410, 3, 2, 26, 44, 42, 72)}<rect class="v" x="345" y="570" width="110" height="92"/><path class="l" d="M400 570v92M345 616h110M320 385h160"/>`,
  belen: `<path class="m" d="M580 700V470h20a50 50 0 0 1 100 0h20v230z"/><rect class="m" x="643" y="392" width="14" height="30"/><path class="l" d="M650 392v-26M641 376h18M580 470h140"/><circle class="v" cx="650" cy="530" r="20"/><path class="v" d="M628 700v-70a22 22 0 0 1 44 0v70z"/>${ventanas(596, 590, 1, 1, 16, 50, 0, 0)}${ventanas(688, 590, 1, 1, 16, 50, 0, 0)}<path class="v" d="M650 300l7 19 20 1-16 13 6 20-17-12-17 12 6-20-16-13 20-1z"/>`,
  reloj: `<path class="m" d="M850 700V300h100v400z"/><rect class="m" x="862" y="228" width="76" height="72"/><path class="m" d="M855 228l45-78 45 78z"/><circle class="v" cx="900" cy="140" r="8"/><circle class="v" cx="900" cy="362" r="36"/><path d="M900 362v-24M900 362l-13-15" stroke="#0b1122" stroke-width="4" stroke-linecap="round"/><path class="v" d="M886 290v-34a14 14 0 0 1 28 0v34z"/>${ventanas(872, 440, 2, 2, 18, 42, 38, 80)}<path class="v" d="M882 700v-52a18 18 0 0 1 36 0v52z"/><path class="l" d="M850 420h100"/>`,
  reyes: `<path class="m" d="M1070 700V482h180v218h-50V600a40 40 0 0 0-80 0v100z"/><rect class="m" x="1058" y="464" width="204" height="20"/><path class="l" d="M1070 520h180"/>${corona(1110, 458)}${corona(1160, 452, 1.25)}${corona(1210, 458)}`,
  cafe: `<path class="m" d="M1330 700V520h180v180z"/><path class="m" d="M1318 596h204l14 34h-232z"/><path class="l" d="M1344 596l-8 34M1388 596l-4 34M1432 596v34M1476 596l4 34M1330 520h180"/><text x="1420" y="562" text-anchor="middle" font-size="19" letter-spacing="5" fill="#d2a94a">CAFÉ</text><rect class="v" x="1346" y="642" width="76" height="44"/><path class="v" d="M1448 700v-50a18 18 0 0 1 36 0v50z"/>${ventanas(1350, 470, 4, 1, 20, 32, 40, 0)}`
};
function pintarPlaza() {
  let s = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="ci" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset=".62" stop-color="#16224a"/><stop offset=".78" stop-color="#2b2f5e"/></linearGradient><filter id="luz" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="900" fill="url(#ci)"/>`;
  for (let k = 0; k < 90; k++) s += `<circle cx="${(k * 181) % 1600}" cy="${(k * 97) % 420}" r="${k % 5 ? 1 : 1.7}" fill="#fff" opacity="${.25 + (k % 4) * .18}"/>`;
  s += `<path fill="#0f1731" d="M0 700V540h70v-40h50v60h110V500h40v-50h30v90h120V520h60v60h90V480h30v-40h24v40h30v100h130V540h80v40h120V500h50v80h110V520h70v60h100V490h40v90h90V540h60v160z"/><rect y="700" width="1600" height="200" fill="#080d1c"/><path d="M0 700h1600" stroke="#d2a94a" stroke-opacity=".5"/>`;
  LUGARES.slice(0, -1).forEach((L, i) => { const a = L.x, b = LUGARES[i + 1].x, m = (a + b) / 2; s += `<path d="M${a} 250Q${m} 320 ${b} 250" fill="none" stroke="#d2a94a" stroke-opacity=".35"/>`; for (let k = 1; k < 8; k++) { const t = k / 8, x = (1 - t) * (1 - t) * a + 2 * (1 - t) * t * m + t * t * b, y = 250 + 2 * (1 - t) * t * 70; s += `<circle class="bomb" data-g="${L.id}" data-c="${['#c9233f', '#f3cf78', '#f4ecdc'][k % 3]}" cx="${x}" cy="${y + 6}" r="5"/>`; } });
  s += `<path d="M775 700V560" stroke="#d2a94a" stroke-opacity=".6" stroke-width="2"/><circle cx="775" cy="552" r="7" fill="#f3cf78" filter="url(#luz)"/><g id="mono"><path d="M775 590v10" stroke="#f4ecdc"/><path d="M775 600a5 5 0 1 1 .1 0M768 612l7-3 7 3-2 3-3-1v8l4 11h-4l-2-8-2 8h-4l4-11v-8l-3 1z" fill="#f4ecdc"/><rect x="755" y="580" width="40" height="60" fill="transparent"/></g>`;
  LUGARES.forEach(L => { s += `<g class="lugar" data-id="${L.id}" tabindex="0"><rect x="${L.x - 115}" y="140" width="230" height="650" fill="transparent"/><rect class="foco" x="${L.x - 112}" y="270" width="224" height="516" rx="6"/>${EDIF[L.id]}<text class="nom" x="${L.x}" y="745">${L.t}</text><text class="fec" x="${L.x}" y="770">${L.f}</text></g>`; });
  s += `<path d="M110 838h1140" stroke="#d2a94a" stroke-opacity=".5"/>`;
  FECHAS.forEach((f, i) => { s += `<g class="nodo" data-i="${i}"><circle cx="${f.x}" cy="838" r="21"/><text class="n" x="${f.x}" y="845">${f.n}</text><text class="t" x="${f.x}" y="880">${f.m}.</text></g>`; });
  s += '</svg>'; $('#plaza').innerHTML = s;
  $$('.lugar').forEach(g => { g.onclick = () => entrar(g.dataset.id); g.onkeydown = (e) => { if (e.key === 'Enter') entrar(g.dataset.id); }; });
  $('#mono').onclick = inocente;
}
function pintarHud() {
  $$('.lugar').forEach(g => { g.classList.toggle('hecho', !!S.hecho[g.dataset.id]); g.classList.toggle('cerrado', g.dataset.id === 'cafe' && !cincoHechos() && !S.profe); });
  $$('.bomb').forEach(b => { const on = !!S.hecho[b.dataset.g]; b.classList.toggle('on', on); b.style.fill = on ? b.dataset.c : ''; });
  $$('.nodo').forEach(n => { const f = FECHAS[n.dataset.i], on = !!S.hecho[f.est]; n.classList.toggle('on', on); $('.t', n).textContent = on ? f.t : f.m + '.'; });
  $('#quien').textContent = S.nombre ? S.nombre + ' · ' + FECHAS.filter(f => S.hecho[f.est]).length + ' / 8 fechas' : '';
  $('#bson').textContent = S.son ? 'Sonido: sí' : 'Sonido: no';
}

/* ====== 4. ESCENA DE EJERCICIO ======================================== */
let relojT = 0, lluviaT = 0, mechaT = 0, limpiar = [];
const C = {
  tabla: $('#tabla'),
  consigna(es, fr) { const c = $('#econs'); c.className = 'cons'; c.innerHTML = `${es}<span class="fr">${fr}</span>`; $('#evoz').onclick = (e) => decir(es, e.target); $('#efr').onclick = () => c.classList.toggle('ver2'); },
  glosa(h) { $('#eglos').innerHTML = h || ''; $('#eglos').style.display = h ? '' : 'none'; },
  msg(t, c) { const m = $('#emsg'); m.textContent = t; m.className = 'msg ' + (c || ''); },
  boton(t, fn) { const z = $('#ebt'); z.innerHTML = ''; if (!t) return; const b = el(`<button class="btn" ${fn ? '' : 'disabled'}>${t}</button>`); if (fn) b.onclick = fn; z.append(b); }
};
function parar() { callar(); $$('video').forEach(v => v.pause()); clearInterval(relojT); clearInterval(lluviaT); clearInterval(mechaT); limpiar.forEach(f => f()); limpiar = []; }
function salir() { parar(); $('#esc').classList.remove('on'); C.tabla.innerHTML = ''; }
function entrar(id) {
  ac();
  if (id === 'cafe' && !cincoHechos() && !S.profe) return aviso('El café está cerrado', '<p>El café abre al final. Visita primero los otros cinco lugares de la plaza.</p>');
  const E = EST[id]; let k = 0, ok = 0, tot = 0;
  $('#efec').textContent = E.f; $('#etit').textContent = E.t; $('#epasos').innerHTML = E.pasos.map(p => `<li>${p.n}</li>`).join(''); $('#esalir').onclick = salir; $('#esc').classList.add('on');
  const paso = () => { parar(); C.tabla.innerHTML = ''; C.msg('', ''); C.boton('', null); C.glosa('');
    $$('#epasos li').forEach((p, j) => p.className = j < k ? 'ya' : j === k ? 'act' : '');
    E.pasos[k].f((a, t) => { ok += a; tot += t; k++; if (k < E.pasos.length) paso(); else { salir(); terminar(id, ok, tot); } }); };
  paso();
}
const seguir = (fin, a, t, texto = '¡Muy bien!') => { bien(); C.msg(texto, 'bien'); C.boton('Continuar', () => fin(a, t)); };

/* Arrastrar y soltar con respuesta inmediata.
   .ficha[data-c] se suelta en .dest[data-a]; data-c="-" = intrusa (no va en ningún sitio).
   También funciona con dos clics (ficha, luego destino). */
function arrastre(o) {
  let sel = null, okN = 0; const fallo = new Set(), T = C.tabla;
  const fichas = () => $$('.ficha:not(.fija)', T), pend = () => fichas().filter(f => f.dataset.c !== '-');
  const libre = (x) => x.dataset.multi || !(x.querySelector('.ficha') || x.classList.contains('on'));
  const soltar = (f, d) => {
    if (!d) return;
    if (d.dataset.a === f.dataset.c && !libre(d)) d = $$('.dest', T).find(x => x.dataset.a === f.dataset.c && libre(x)) || d;
    if (d.dataset.a === f.dataset.c && libre(d)) {
      f.classList.remove('sel'); f.classList.add('fija'); if (!fallo.has(f)) okN++; clic(okN); C.msg('', '');
      if (o.ok) o.ok(f, d); else { d.append(f); d.classList.add('lleno'); }
      if (!pend().length) { fichas().forEach(x => x.style.visibility = 'hidden'); o.fin(okN, o.total); }
    } else { fallo.add(f); mal(); f.classList.remove('no'); void f.offsetWidth; f.classList.add('no'); C.msg((o.pista && o.pista(f, d)) || 'No es aquí. Prueba otra vez.', 'mal'); }
  };
  $$('.ficha', T).forEach(f => {
    f.onpointerdown = (e) => { if (f.classList.contains('fija')) return; e.preventDefault(); const x0 = e.clientX, y0 = e.clientY; let mov = false; try { f.setPointerCapture(e.pointerId); } catch (er) {}
      const bajo = (ev) => { f.style.pointerEvents = 'none'; const d = document.elementFromPoint(ev.clientX, ev.clientY); f.style.pointerEvents = ''; return d && d.closest('.dest'); };
      const mueve = (ev) => { const dx = ev.clientX - x0, dy = ev.clientY - y0; if (!mov && Math.hypot(dx, dy) < 6) return; mov = true; f.classList.add('vuela'); f.style.transform = `translate(${dx}px,${dy}px)`; $$('.dest.sobre', T).forEach(x => x.classList.remove('sobre')); const dd = bajo(ev); if (dd) dd.classList.add('sobre'); };
      const suelta = (ev) => { f.removeEventListener('pointermove', mueve); f.removeEventListener('pointerup', suelta); f.removeEventListener('pointercancel', suelta); $$('.dest.sobre', T).forEach(x => x.classList.remove('sobre'));
        if (!mov) { if (sel) sel.classList.remove('sel'); sel = sel === f ? null : f; if (sel) f.classList.add('sel'); return; }
        const d = bajo(ev); f.classList.remove('vuela'); f.style.transform = ''; soltar(f, d); };
      f.addEventListener('pointermove', mueve); f.addEventListener('pointerup', suelta); f.addEventListener('pointercancel', suelta); };
  });
  $$('.dest', T).forEach(d => d.addEventListener('click', () => { if (sel && !sel.classList.contains('fija')) { const f = sel; sel = null; f.classList.remove('sel'); soltar(f, d); } }));
  C.msg('Arrastra cada ficha a su sitio.', '');
}
const fichasHTML = (items) => baraja(items).map(([t, c]) => `<div class="ficha" data-c="${c}">${t}</div>`).join('');
function opciones(cont, pregs, fin) {    // preguntas de elección; fin(aciertos a la primera, total)
  let ok = 0, hechas = 0;
  pregs.forEach(q => { const n = el(`<div class="preg"><p>${q.p}</p><div class="elige"></div></div>`); let fallo = false;
    baraja(q.o.map((t, i) => ({ t, i }))).forEach(o => { const b = el(`<button class="op">${o.t}</button>`); b.onclick = () => { if (b.classList.contains('ko') || n.dataset.fin) return;
      if (o.i === q.c) { b.classList.add('ok'); n.dataset.fin = 1; clic(hechas); hechas++; if (!fallo) ok++; $$('.op', n).forEach(x => x !== b && x.classList.add('ko')); if (hechas === pregs.length) fin(ok, pregs.length); } else { b.classList.add('ko'); fallo = true; mal(); } };
      $('.elige', n).append(b); }); cont.append(n); });
}
function videoHTML(src) { return `<video src="${src}" controls controlslist="nofullscreen nodownload noplaybackrate" disablepictureinpicture preload="metadata" onerror="this.outerHTML='<p>El vídeo no está disponible. Pregunta a tu profesor.</p>'"></video>`; }
function escribir(d, fin) {
  C.tabla.innerHTML = `<div class="hoja"><div class="chips">${d.ayudas.map(a => `<button data-t="${a}">${a}</button>`).join('')}${'áéíóúñ¿¡'.split('').map(c => `<button class="ac" data-t="${c}">${c}</button>`).join('')}</div><textarea spellcheck="false"></textarea><div class="cuenta"><span id="np">0</span> palabras · mínimo ${d.min}</div></div>`;
  const ta = $('textarea', C.tabla); ta.value = S[d.clave] || d.inicio || '';
  const cuenta = () => { const k = (ta.value.match(/[\wáéíóúñü]+/gi) || []).length; $('#np').textContent = k; return k; };
  ta.oninput = () => { cuenta(); S[d.clave] = ta.value; guardar(); };
