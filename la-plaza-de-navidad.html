<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La plaza de Navidad</title>
<style>
@font-face{font-family:Atkinson;src:url(vendor/fonts/AtkinsonHyperlegible-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Atkinson;src:url(vendor/fonts/AtkinsonHyperlegible-Bold.ttf);font-weight:700;font-display:swap}
/* Volume et lumière : rouge, vert, or et crème de Noël ; dégradés, ombres douces, halos ; textes nets */
:root{--rojo:#b3182f;--rojo2:#7d0f20;--verde:#1f6b4c;--verde2:#0d3526;--oro:#e9b949;--oro2:#fff0b8;--crema:#fff8ea;--crema2:#f1e3c6;--tinta:#1e2a26;--gris:#7c8a82;--noche:#0b1533;
--goro:linear-gradient(#fff3c4,#e9b949 55%,#b8862b);--grojo:linear-gradient(#d4364a,#a4142c);--gverde:linear-gradient(#2f8f68,#1b5a41)}
*{box-sizing:border-box}
html{font-size:clamp(10px,min(1.14vw,2.03vh),24px)}
body{margin:0;height:100vh;overflow:hidden;background:var(--noche);color:var(--crema);font-family:Atkinson,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.4;user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
.serif{font-family:Georgia,"Times New Roman",serif}
.ver{font-variant:small-caps;letter-spacing:.14em;font-size:.85rem;color:var(--oro);font-weight:700}
.dorado{background:var(--goro);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .12rem .12rem rgba(0,0,0,.55))}

/* ---------- la calle en perspectiva ---------- */
#plaza{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#070f2b 0%,#14235c 46%,#3b3a7c 62%,#a2607f 72%,#e6a27c 76%)}
.capa{position:absolute;left:50%;will-change:transform}
.capa svg{display:block;width:100%;height:100%}
#cielo{position:absolute;inset:0 0 14.5rem 0;background:radial-gradient(circle at 78% 18%,rgba(255,244,200,.95) 0 2.1rem,rgba(255,236,170,.35) 2.2rem 4.5rem,transparent 9rem)}
#lejos{bottom:14.5rem;width:170rem;height:20rem;margin-left:-85rem}
#medio{bottom:14.5rem;width:230rem;height:15rem;margin-left:-115rem}
#suelo{position:absolute;left:0;right:0;bottom:0;height:14.5rem;background:radial-gradient(ellipse 36rem 7rem at 50% 0,rgba(255,214,130,.75),transparent 70%),linear-gradient(#f6f9ff,#cddaf0 35%,#93a8cf);box-shadow:0 -.3rem 1.2rem rgba(10,18,48,.45)}
#fila{position:absolute;left:50%;bottom:14.2rem;width:0;height:0;perspective:68rem;perspective-origin:50% -15rem}
.edif{position:absolute;left:-12rem;bottom:0;width:24rem;height:30rem;transform-origin:50% 100%;cursor:pointer;will-change:transform,filter;outline:none}
.edif svg{width:100%;height:100%;display:block;overflow:visible}
.edif .v{fill:#1a2646;transition:fill .8s}
.edif.hecho .v{fill:url(#gLuz);filter:url(#fHalo)}
.edif .b{fill:#7a6a4a;transition:fill .8s}
.edif.hecho .b{fill:#ffe08a;filter:url(#fHalo)}
.edif .astro{opacity:.4;transition:opacity .8s}
.edif.hecho .astro{opacity:1;filter:url(#fHalo)}
.edif.cerrado svg{filter:grayscale(.7)}
.edif.centro:hover svg{filter:drop-shadow(0 0 1.2rem rgba(255,224,138,.8))}
#cerca{top:4.2rem;width:330rem;height:7rem;margin-left:-165rem;pointer-events:none}
#nieve{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nav{position:absolute;top:38%;width:4rem;height:4rem;border-radius:50%;border:0;background:var(--goro);color:#5a3a06;font-size:1.6rem;font-weight:700;cursor:pointer;box-shadow:0 .3rem 0 #8a6416,0 .7rem 1.2rem rgba(0,0,0,.45);z-index:5}
.nav:active{translate:0 .2rem;box-shadow:0 .1rem 0 #8a6416}
.nav[disabled]{opacity:.25;cursor:default}
#nizq{left:1.6rem}#nder{right:1.6rem}
#placa{position:absolute;left:50%;bottom:6.6rem;translate:-50% 0;width:38rem;display:flex;align-items:center;gap:1.4rem;background:linear-gradient(var(--crema),var(--crema2));color:var(--tinta);border-radius:1.1rem;padding:.9rem 1.2rem .9rem 1.6rem;box-shadow:0 .9rem 2rem rgba(10,18,48,.45),inset 0 0 0 .14rem var(--oro);z-index:6}
#placa .tx{flex:1}
#placa .ver{color:var(--rojo)}
#placa h2{font-family:Georgia,serif;font-size:1.9rem;line-height:1.15;color:var(--verde2)}
#placa .est{font-size:.9rem;color:#4d5f56}
#placa .btn{width:auto;font-size:1.15rem;padding:.8rem 1.8rem}
#linea{position:absolute;left:50%;bottom:.9rem;translate:-50% 0;display:flex;gap:.7rem;z-index:6}
.chip{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.15rem;color:#33456f;font-size:.72rem;font-weight:700;width:5.4rem}
.chip i{font-style:normal;width:2.7rem;height:2.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:1.25rem;background:linear-gradient(#fff,#dfe8f6);color:#33456f;box-shadow:0 .2rem .5rem rgba(10,18,48,.3),inset 0 0 0 .1rem #b9c8e2;transition:all .6s}
.chip.on i{background:var(--goro);color:#5a1010;box-shadow:0 0 1.2rem #ffd66b,inset 0 0 0 .1rem #fff3c4}
.chip.on{color:var(--rojo2)}
#cab{position:fixed;top:.9rem;left:1.6rem;right:1.6rem;display:flex;align-items:center;gap:1.2rem;z-index:7;pointer-events:none}
#cab h1{font-size:2.1rem;font-weight:700;font-style:italic}
#cab .ver{color:var(--oro2);text-shadow:0 .1rem .2rem #000}
#cab .sp{flex:1}
#cab button{pointer-events:auto;background:rgba(255,248,234,.14);border:.1rem solid rgba(255,240,184,.7);color:var(--crema);border-radius:2rem;padding:.3rem 1rem;cursor:pointer;font-size:.85rem;font-weight:700;backdrop-filter:blur(4px)}
#cab button:hover{background:var(--goro);color:#5a3a06}

/* ---------- escena de ejercicio ---------- */
#esc{position:fixed;inset:0;z-index:10;display:none;grid-template:4.2rem auto 1fr/1fr;background:radial-gradient(circle at 12% 30%,rgba(255,214,107,.16) 0 5rem,transparent 9rem),radial-gradient(circle at 92% 88%,rgba(212,54,74,.25) 0 6rem,transparent 11rem),radial-gradient(circle at 60% 6%,rgba(255,214,107,.12) 0 4rem,transparent 8rem),radial-gradient(circle at 30% 0,#1c6046,#082a1f 75%)}
#esc.on{display:grid}
#esc>header{grid-column:1/-1;display:flex;align-items:center;gap:1.6rem;padding:0 1.6rem;background:linear-gradient(#c5203a,#8a1023);box-shadow:0 .3rem 1rem rgba(0,0,0,.4),inset 0 -.14rem 0 var(--oro);z-index:1}
#esc>header .ver{color:var(--oro2)}
#esc>header h2{font-size:1.65rem;font-weight:700;color:#fff;text-shadow:0 .12rem .2rem rgba(0,0,0,.45)}
.pasos{display:flex;gap:.5rem;list-style:none;flex:1}
.pasos li{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#f6d6da;background:rgba(0,0,0,.18);padding:.3rem .9rem;border-radius:2rem;font-weight:700}
.pasos li.act{background:var(--goro);color:#5a1010;box-shadow:0 .15rem .5rem rgba(0,0,0,.35)}
.pasos li.ya{color:#fff}
.pasos li.ya::before{content:"✓ "}
.salir{background:rgba(255,255,255,.12);border:.1rem solid rgba(255,255,255,.7);color:#fff;border-radius:2rem;padding:.35rem 1.1rem;cursor:pointer;font-size:.88rem;font-weight:700}
.salir:hover{background:#fff;color:var(--rojo)}
#esc aside{background:rgba(4,24,17,.5);padding:.55rem 1.6rem;display:flex;flex-direction:row;align-items:center;gap:1.1rem;border-bottom:.1rem solid rgba(233,185,73,.45);position:relative;min-height:3.4rem}
#esc aside .cons{flex:1;font-size:1.22rem;line-height:1.3}
#esc aside .cons .fr{margin-top:.15rem}
#esc aside .glos{display:none;position:absolute;left:1.6rem;top:calc(100% + .5rem);z-index:6;width:30rem;background:#0b3325;border:.12rem solid var(--oro);border-radius:.9rem;padding:.9rem 1.1rem;box-shadow:0 .8rem 2rem rgba(0,0,0,.5)}
#esc aside.ayuda .glos{display:block}
#esc aside .msg{margin:0;min-height:0;max-width:24rem;text-align:right}
#esc aside .btn{width:auto;white-space:nowrap;padding:.55rem 1.4rem}
.cons{font-size:1.18rem;font-weight:700;line-height:1.38;color:#fff}
.cons .fr{display:none;font-weight:400;font-style:italic;color:#cfe3d6;font-size:.98rem;margin-top:.5rem}
.cons.ver2 .fr{display:block}
.ut{display:flex;gap:.5rem}
.mini{background:rgba(255,248,234,.12);border:.1rem solid rgba(255,240,184,.6);border-radius:2rem;padding:.2rem .9rem;cursor:pointer;font-size:.85rem;color:var(--crema);font-weight:700}
.mini:hover,.mini.habla{background:var(--goro);color:#5a3a06}
.glos{font-size:.93rem;color:#d5e6db;border-top:.1rem solid rgba(233,185,73,.4);padding-top:.8rem;line-height:1.5}
.glos b{color:var(--oro2)}
.glos li{margin-left:1.1rem;margin-bottom:.3rem}
.msg{margin-top:auto;font-weight:700;min-height:2.8em;font-size:1.05rem;color:var(--crema)}
.msg.bien{color:#a6f0be}.msg.mal{color:#ffc2c7}
.btn{background:var(--goro);color:#4a2c05;border:0;border-radius:.8rem;padding:.75rem 1.4rem;font-weight:700;cursor:pointer;letter-spacing:.03em;width:100%;font-size:1.05rem;box-shadow:0 .25rem 0 #8a6416,0 .6rem 1rem rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.07)}
.btn:active{translate:0 .15rem;box-shadow:0 .1rem 0 #8a6416}
.btn[disabled]{opacity:.4;cursor:default}
.btn.oro{background:var(--gverde);color:#fff;box-shadow:0 .25rem 0 #0f3526,0 .6rem 1rem rgba(0,0,0,.3)}
#tabla{position:relative;margin:.8rem;border-radius:1.4rem;background:linear-gradient(#fffaf0,#f3e6cb);color:var(--tinta);box-shadow:0 1.2rem 3rem rgba(0,0,0,.5),inset 0 0 0 .14rem rgba(233,185,73,.9),inset 0 0 0 .5rem rgba(255,255,255,.55);padding:1.4rem 1.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;overflow:hidden}

.ficha{background:var(--grojo);color:#fff;border:0;border-radius:.6rem;padding:.42rem 1rem;font-weight:700;cursor:grab;touch-action:none;position:relative;white-space:nowrap;box-shadow:0 .22rem 0 #6f0d1e,0 .5rem .8rem rgba(60,20,10,.28),inset 0 .1rem 0 rgba(255,255,255,.35);transition:box-shadow .2s}
.ficha:hover,.ficha.sel{box-shadow:0 .22rem 0 #6f0d1e,0 0 0 .22rem var(--oro),0 .5rem .8rem rgba(60,20,10,.28)}
.ficha.vuela{z-index:50;cursor:grabbing;box-shadow:0 .22rem 0 #6f0d1e,0 1.2rem 1.6rem rgba(40,15,10,.45);transition:none;scale:1.06}
.ficha.no{animation:no .35s}
@keyframes no{25%{translate:-.4rem 0}75%{translate:.4rem 0}}
.ficha.fija{cursor:default;background:var(--gverde);box-shadow:0 .16rem 0 #0f3526,inset 0 .1rem 0 rgba(255,255,255,.3);animation:pop .35s}
@keyframes pop{50%{scale:1.12}}
.bandeja{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;min-height:2.6rem;max-width:56rem}
.dest{transition:all .2s}
.dest.sobre{outline:.2rem solid var(--oro);outline-offset:.15rem}
.caja{border:.1rem dashed #b79a5d;border-radius:.7rem;background:#efe1c2;box-shadow:inset 0 .15rem .45rem rgba(80,50,10,.22);min-height:2.9rem;min-width:9rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;padding:.3rem;color:#7b6c4e;font-size:.88rem}
.caja.lleno{border-style:solid;border-color:var(--verde)}
.rot{font-variant:small-caps;letter-spacing:.1em;color:var(--rojo);font-size:1.02rem;font-weight:700}

.duo{display:grid;grid-template-columns:33rem 1fr;gap:2rem;align-items:center;width:100%}
video{width:100%;border-radius:.9rem;background:#000;display:block;box-shadow:0 .8rem 1.8rem rgba(40,20,10,.4),0 0 0 .2rem var(--oro)}
.bombo{display:flex;flex-direction:column;gap:1.1rem}
.ruedas{display:flex;gap:.4rem;align-items:center}
.rueda{display:flex;flex-direction:column;align-items:center}
.rueda button{background:none;border:0;color:var(--rojo);cursor:pointer;font-size:1rem;padding:.1rem .6rem}
.rueda span{width:3.3rem;height:3.3rem;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#f4e2b4 55%,#cfa95a);color:var(--rojo2);display:flex;align-items:center;justify-content:center;font-size:1.75rem;font-weight:700;font-family:Georgia,serif;box-shadow:0 .3rem .6rem rgba(60,30,5,.35);transition:transform .25s}
.rueda span.gira{transform:rotateX(360deg)}
.ruedas i{font-size:2rem;color:var(--verde);font-style:normal}
.elige{display:flex;flex-wrap:wrap;gap:.5rem}
.op{background:linear-gradient(#fff,#f1e6cf);border:.1rem solid #c9b07a;color:var(--tinta);border-radius:.7rem;padding:.42rem 1rem;cursor:pointer;font-weight:700;box-shadow:0 .15rem 0 #c9b07a}
.op:hover{border-color:var(--oro);box-shadow:0 .15rem 0 #c9b07a,0 0 0 .18rem rgba(233,185,73,.5)}
.op.sel{background:var(--gverde);color:#fff;border-color:#0f3526;box-shadow:0 .15rem 0 #0f3526}
.op.ok{background:var(--goro);color:#4a2c05;border-color:#b8862b;box-shadow:0 .15rem 0 #8a6416}
.op.ko{opacity:.4;text-decoration:line-through;cursor:default;box-shadow:none}
.grupo.mal{outline:.16rem dashed var(--rojo);outline-offset:.4rem;border-radius:.4rem}
.preg{margin-bottom:1rem}
.preg p{font-weight:700;margin-bottom:.45rem;font-size:1.05rem}
.hilo{display:grid;grid-template-columns:repeat(8,6.7rem);gap:.5rem;position:relative;padding-top:1.4rem}
.hilo::before{content:"";position:absolute;left:1rem;right:1rem;top:2rem;border-top:.16rem solid var(--verde)}
.hilo .pos{display:flex;flex-direction:column;align-items:center;gap:.5rem;position:relative}
.hilo .bu{width:1.4rem;height:1.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c2bd);box-shadow:0 .15rem .3rem rgba(0,0,0,.3);transition:all .5s}
.hilo .pos.on .bu{background:radial-gradient(circle at 35% 30%,#fff7d0,#f2b830);box-shadow:0 0 1.3rem .3rem #ffd66b;scale:1.2}
.hilo .dia{font-family:Georgia,serif;font-size:1.65rem;text-align:center;color:var(--rojo);font-weight:700;line-height:1.1}
.hilo .dia small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);font-family:Atkinson,sans-serif}
.hilo .caja{min-width:0;width:100%;min-height:4.3rem}
.hilo .ficha,.bandeja.peq .ficha{white-space:normal;text-align:center;font-size:.86rem;padding:.3rem .5rem}
#establo{width:44rem;height:25rem;filter:drop-shadow(0 .8rem .8rem rgba(60,30,10,.3))}
#establo .fig{fill:#b7c4bb;transition:all .6s}
#establo .dest.on .fig{fill:url(#gVerde)}
#establo .dest.sobre .fig{fill:#e9b949}
#establo .dest text{fill:var(--rojo2);font-size:16px;text-anchor:middle;opacity:0;transition:opacity .6s;font-weight:700;font-family:Georgia,serif}
#establo .dest.on text{opacity:1}
#establo .astro{fill:url(#gOro);opacity:.3;transition:all 1s;transform-origin:350px 40px}
#establo.fin .astro{opacity:1;scale:1.35;filter:url(#fHalo)}
.fuera{min-width:14rem}
.def{font-family:Georgia,serif;font-size:1.45rem;line-height:2.5;max-width:52rem;text-align:center}
.def .dest{display:inline-flex;min-width:9rem;min-height:2.3rem;border-bottom:.16rem solid var(--rojo);vertical-align:middle;justify-content:center;align-items:center;margin:0 .2rem}
.def .ficha{font-family:Atkinson,sans-serif;font-size:1rem;line-height:1.3}
.campanas{display:flex;gap:1.1rem;align-items:flex-end}
.camp{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--verde);font-size:.92rem;font-weight:700}
.camp svg{width:5.2rem;height:6rem;fill:url(#gBronce);filter:drop-shadow(0 .4rem .4rem rgba(60,30,5,.35));transition:all .15s}
.camp.luz svg{fill:url(#gOro);filter:drop-shadow(0 0 .9rem #ffcf4a)}
.camp.luz{color:var(--rojo)}
.camp.toca svg{animation:bal .4s}
@keyframes bal{30%{transform:rotate(-9deg)}70%{transform:rotate(7deg)}}
.pauta{display:flex;gap:.3rem}
.pauta i{width:.8rem;height:.8rem;border-radius:50%;background:#dccfb1}
.pauta i.ya{background:var(--rojo)}
.mesa{position:relative;width:50rem;height:15rem;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#c5293f,#7d0f20);box-shadow:0 1.4rem 2rem rgba(60,20,10,.4),inset 0 0 0 .3rem #e9b949,inset 0 0 0 .7rem rgba(255,255,255,.12)}
.mesa .plato{position:absolute;width:8.6rem;height:8.6rem;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff 0 46%,#efe6d2 58%,#d9ccb0 60%,#fff 66%,#e8dcc2);box-shadow:0 .5rem .8rem rgba(40,10,10,.45);translate:-50% -50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;color:#8b7c5f;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.mesa .plato .ficha{white-space:normal;font-size:.88rem;text-transform:none;letter-spacing:0;background:none;color:var(--rojo2);padding:0 1.3rem;box-shadow:none}
.mesa .plato.lleno{box-shadow:0 0 1.4rem .3rem #ffd66b,0 .5rem .8rem rgba(40,10,10,.45)}
.verbo{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 2.4rem}
.pers{display:flex;align-items:center;gap:.5rem;border:.14rem solid transparent;border-radius:.8rem;padding:.45rem .9rem;transition:all .6s}
.pers .pr{width:10.5rem;color:var(--verde);font-size:.98rem;font-weight:700}
.pers .fo{font-family:Georgia,serif;font-size:1.95rem;display:flex;align-items:center;font-weight:700}
.raiz{background:linear-gradient(#fff,#f1e6cf);border:.12rem solid var(--rojo);color:var(--rojo);border-radius:.5rem;cursor:pointer;font-family:Georgia,serif;font-size:1.7rem;font-weight:700;min-width:3.4rem;margin:0 .15rem;padding:0 .3rem;box-shadow:0 .18rem 0 var(--rojo2);transition:scale .15s}
.raiz:active{scale:.85}
.pers .caja{min-width:5rem;min-height:2.6rem;margin-left:.2rem}
.pers .caja .ficha{font-family:Georgia,serif;font-size:1.3rem;padding:.1rem .6rem}
.pers.bota{border-color:var(--oro);background:rgba(255,214,107,.35);box-shadow:0 0 1rem rgba(255,214,107,.7)}
.pers.mal .raiz{background:var(--grojo);color:#fff}
.tarjeta{width:44rem;background:#fff;border-radius:1rem;padding:2rem 2rem 1.6rem;text-align:center;box-shadow:0 .9rem 2rem rgba(60,30,10,.3);border-top:.5rem solid var(--rojo)}
.tarjeta p{font-family:Georgia,serif;font-size:1.75rem;min-height:4.6rem}
.tarjeta u{text-decoration:none;border-bottom:.16rem solid var(--rojo);padding:0 1.6rem;color:var(--rojo);font-weight:700}
.mecha{height:.5rem;background:#e7dcc3;border-radius:.3rem;margin:1.2rem 0;overflow:hidden}
.mecha i{display:block;height:100%;background:var(--grojo);width:100%}
.dosb{display:flex;gap:1.2rem;justify-content:center}
.dosb button{flex:1;max-width:14rem;font-family:Georgia,serif;font-size:1.5rem;font-weight:700;padding:.7rem;border:0;background:var(--gverde);border-radius:.8rem;cursor:pointer;color:#fff;box-shadow:0 .25rem 0 #0f3526}
.dosb button:hover{filter:brightness(1.12)}
.dosb small{display:block;font-family:Atkinson,sans-serif;font-size:.7rem;color:#cfe3d6}
.esfera{position:relative;width:50rem;height:27rem}
.esfera svg{position:absolute;left:50%;top:46%;translate:-50% -50%;width:14rem;height:14rem;filter:drop-shadow(0 .6rem .8rem rgba(60,30,10,.35))}
.esfera .q{position:absolute;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.esfera .q .caja{min-width:16.5rem}
#reloj{width:11rem;height:11rem;filter:drop-shadow(0 .6rem .8rem rgba(60,30,10,.35))}
#reloj.dong{animation:dong .5s}
@keyframes dong{20%{transform:scale(1.1) rotate(-3deg)}60%{transform:rotate(3deg)}}
#uvas{display:grid;grid-template-columns:repeat(12,4.2rem);gap:.3rem}
#uvas div{text-align:center;font-size:.74rem;color:var(--verde);font-weight:700}
#uvas span{display:block;width:2.4rem;height:2.7rem;margin:0 auto .4rem;border-radius:50%;background:radial-gradient(circle at 35% 28%,#eaf6b0,#8fb53c 55%,#557a1c);box-shadow:0 .25rem .4rem rgba(40,60,10,.35);transition:all .3s}
#uvas .act span{transform:scale(1.4);box-shadow:0 0 1.3rem .3rem #ffd66b}

function final() {
  const [a, t] = total(), falta = !S.hecho.inocente;
  const n = el(`<div class="vent" style="width:min(50rem,94vw)"><div class="ver">La plaza está iluminada</div><h1>¡Felices <em>fiestas</em>, ${S.nombre}!</h1><div class="filete"></div><p>Total: <b>${a} / ${t}</b> respuestas correctas a la primera.</p><div class="res">${LUGARES.map(L => `<div>${EST[L.id].t}<b>${(S.pts[L.id] || ['–', '–']).join(' / ')}</b></div>`).join('')}</div>${falta ? '<p class="fr">Falta una fecha: el 28 de diciembre. Una broma se esconde en la plaza… Búscala.</p>' : '<p><b>Las ocho fechas del calendario están encendidas.</b></p>'}<p>Descarga tu ficha: te ayuda a preparar tu presentación oral.</p><p><button class="btn" id="pdf">Mi ficha de Navidad (PDF)</button><button class="btn sec" id="vol">Volver a la plaza</button><button class="btn sec" id="otra">Empezar de nuevo</button></p></div>`);
  $('#otra', n).onclick = reiniciar; $('#pdf', n).onclick = ficha; $('#vol', n).onclick = cerrarVelo; abrirVelo(n); fuegos(); setTimeout(fuegos, 900);
}
function ficha() {
  if (!window.jspdf) return alert('PDF no disponible.');
  const d = new jspdf.jsPDF({ unit: 'mm', format: 'a4' }), M = 18, W = 210 - 2 * M; let y = 20;
  const limpio = (s) => s.replace(/[«»]/g, '"').replace(/[^\x20-\x7E\xA1-\xFF\n]/g, '');
  const tit = (s) => { if (y > 262) { d.addPage(); y = 20; } d.setFont('helvetica', 'bold'); d.setFontSize(13); d.setTextColor(164, 20, 44); d.text(limpio(s), M, y); y += 2; d.setDrawColor(210, 169, 74); d.line(M, y, M + W, y); y += 6; };
  const txt = (s) => { d.setFont('helvetica', 'normal'); d.setFontSize(11); d.setTextColor(40, 30, 25); d.splitTextToSize(limpio(s), W).forEach(l => { if (y > 282) { d.addPage(); y = 20; } d.text(l, M, y); y += 5.6; }); };
  const [a, t] = total();
  d.setFont('helvetica', 'bold'); d.setFontSize(20); d.setTextColor(164, 20, 44); d.text('Mi ficha de Navidad', M, y); y += 8;
  txt(`${S.nombre} · ${new Date().toLocaleDateString('es-ES')} · La plaza de Navidad: ${a} / ${t}`); y += 3;
  tit('El calendario navideño de España');
  txt('22 de diciembre: el sorteo de la lotería de Navidad (El Gordo) · 24: Nochebuena · 25: Navidad · 28: Santos Inocentes (día de bromas) · 31: Nochevieja · 1 de enero: Año Nuevo · 5 de enero: la cabalgata de Reyes · 6 de enero: Día de Reyes.'); y += 3;
  tit('Lo que sé');
  ['El belén es una representación del nacimiento de Jesús.', 'El villancico es una composición musical popular y tradicional de significado religioso que se canta durante las festividades navideñas.', 'Para Nochebuena, a los españoles les gusta reunirse con la familia. Les encantan las recetas navideñas. Suelen cenar platos típicos, como el pavo. De postre, suelen preparar o comprar turrones, polvorones y mazapanes.', 'En Nochevieja, los españoles suelen comer doce uvas al son de las campanadas, a medianoche, para tener buena suerte. La tradición nace en 1909.', 'La noche del 5 de enero, Melchor, Gaspar y Baltasar suelen desfilar por las calles. Les gusta repartir caramelos. A los niños les encanta escribir una carta a los Reyes Magos.'].forEach(s => { txt('• ' + s); y += 1; }); y += 2;
  tit('Para comparar'); txt('más ... que · menos ... que · mientras que · en cambio'); txt('SOLER: suelo, sueles, suele, solemos, soléis, suelen'); y += 3;
  if (S.comp) { tit('Mi comparación España / Francia'); txt(S.comp); y += 3; }
  if (S.carta) { tit('Mi carta a los Reyes Magos'); txt(S.carta); }
  d.save('ficha-navidad-' + (S.nombre || 'alumno').replace(/[^\wáéíóúñ]+/gi, '-') + '.pdf');
}
function fuegos() {
  const c = $('#fuegos'), g = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; const ps = [];
  for (let k = 0; k < 4; k++) { const x = innerWidth * (.2 + Math.random() * .6), y = innerHeight * (.12 + Math.random() * .3), col = ['#ffd66b', '#ff5a6e', '#fff8ea', '#5fd39a'][k % 4]; for (let j = 0; j < 46; j++) { const a = Math.random() * 6.28, v = 2 + Math.random() * 5; ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, t: 0 }); } }
  [0, .15, .3].forEach(dt => tono(900 + Math.random() * 600, ahora() + dt, .25, 'triangle', .05));
  (function f() { g.clearRect(0, 0, c.width, c.height); let viva = false; ps.forEach(p => { p.t++; if (p.t > 70) return; viva = true; p.x += p.vx; p.y += p.vy; p.vy += .08; g.globalAlpha = 1 - p.t / 70; g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, 4, 0, 6.28); g.fill(); }); g.globalAlpha = 1; if (viva) requestAnimationFrame(f); else g.clearRect(0, 0, c.width, c.height); })();
}
function profe() {
  const n = el(`<div class="vent"><h2>Modo profesor</h2><p><input type="password" id="cod" placeholder="Código"></p><div id="pp" style="display:none"><p class="fr">Alumno: <b>${S.nombre || '—'}</b> · puntos: ${total().join(' / ')}</p><p><button class="btn sec" id="p2">Marcar todo como hecho</button><button class="btn sec" id="p4">Pantalla final</button><button class="btn" id="p3">Borrar la partida</button></p></div><p><button class="btn sec" id="p0">Cerrar</button></p></div>`);
  $('#p0', n).onclick = cerrarVelo; $('#cod', n).oninput = (e) => { if (e.target.value === CODIGO_ADMIN) { e.target.style.display = 'none'; $('#pp', n).style.display = ''; } };
  $('#p2', n).onclick = () => { LUGARES.forEach(L => { S.hecho[L.id] = 1; S.pts[L.id] = S.pts[L.id] || [0, 0]; }); S.hecho.inocente = 1; guardar(); pintarHud(); cerrarVelo(); };
  $('#p4', n).onclick = () => final();
  $('#p3', n).onclick = () => { if (confirm('¿Borrar la partida de este ordenador?')) { try { localStorage.removeItem(CLAVE); } catch (e) {} location.hash = ''; location.reload(); } };
  abrirVelo(n); setTimeout(() => $('#cod', n).focus(), 50);
}

/* ====== 7. INICIO ====================================================== */
pintarPlaza(); pintarHud();
$('#bson').onclick = () => { S.son = S.son ? 0 : 1; guardar(); pintarHud(); if (S.son) campana(294, .15); else callar(); };
function reiniciar() {
  const n = el(`<div class="vent"><h2>¿Empezar de nuevo?</h2><p>Vas a borrar toda tu partida: los lugares terminados, tus puntos, tu carta y tu comparación.</p><p class="fr">Tu vas effacer toute ta partie : les lieux terminés, tes points, ta lettre et ta comparaison. C’est définitif.</p><p><button class="btn" id="rs">Sí, borrar todo</button><button class="btn sec" id="rn">No, continuar mi partida</button></p></div>`);
  $('#rn', n).onclick = cerrarVelo;
  $('#rs', n).onclick = () => { try { localStorage.removeItem(CLAVE); } catch (e) {} S = base(); cerrarVelo(); elegir(null); pintarHud(); portada(); };
  abrirVelo(n);
}
$('#bnuevo').onclick = reiniciar;
$('#bayuda').onclick = () => aviso('¿Cómo se juega?', '<p>Arrastra la plaza para girarla. Haz clic en un lugar para acercarte y elegir una actividad.</p><p>Puedes hacer los lugares y las actividades en el orden que quieras.</p><p class="fr">Fais glisser la place pour la faire tourner, clique sur un lieu pour t’en approcher et choisir une activité. Dans chaque activité : « Escuchar » lit la consigne, « En français » la traduit. Une date ne s’allume qu’en cherchant bien près du sapin…</p><p class="fr" style="font-size:.78rem">Modelos 3D: Kenney, Quaternius, jeremy y Scott Marshall (poly.pizza). Motor: three.js.</p>');
addEventListener('keydown', e => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); profe(); } });
portada();
if (location.hash === '#profe') setTimeout(profe, 300);
</script>
