*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#FBF8EF;color:#1E1B4B;font-family:AT,Verdana,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:#1E1B4B;color:#fff;display:flex;align-items:center;gap:2vw;padding:1.6vh 2.5vw;flex:none}header h1{font-family:AW;font-weight:400;font-size:min(3.6vw,6vh);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header span{font-size:min(1.8vw,3vh);opacity:.8}
main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.8vh;padding:2vh 3vw}
footer{flex:none;display:flex;justify-content:center;gap:1.5vw;padding:1.2vh}button{font:700 min(2vw,3.4vh) AT,sans-serif;border:0;border-radius:99px;padding:1.2vh 2.4vw;background:#1E1B4B;color:#fff;cursor:pointer}button.g{background:#E5E7F2;color:#1E1B4B}button:focus-visible{outline:.4vw solid #F59E0B}
.act{font-size:min(3vw,5vh);font-weight:700}.act b{font-family:AW;font-weight:400;background:var(--c,#1E1B4B);color:#fff;border-radius:1vw;padding:.3vh 1.2vw;margin-right:1vw}
.plan div{display:flex;align-items:center;gap:1.6vw;background:#fff;border-radius:1.4vw;padding:1.3vh 2vw;font-size:min(3.2vw,5.4vh);font-weight:700;box-shadow:0 .5vh 1.6vh rgba(30,27,75,.1);border-left:1.2vw solid var(--c)}.plan{display:flex;flex-direction:column;gap:1.4vh}
.plan i,.n{font-style:normal;flex:none;display:inline-grid;place-items:center;width:min(5vw,8.4vh);height:min(5vw,8.4vh);border-radius:50%;background:var(--c);color:#fff;font-family:AW;font-size:.75em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.5vw}.col{background:#fff;border-radius:1.6vw;border-top:1.4vh solid var(--c);padding:1.2vh 2vw 1.6vh;box-shadow:0 .5vh 1.6vh rgba(30,27,75,.1)}
.col h2{font-family:AW;font-weight:400;color:var(--c);font-size:min(4vw,6.6vh);margin:0 0 .6vh;text-align:center}.col table{width:100%;border-collapse:collapse;font-size:min(3vw,5vh)}.col td{padding:.25vh .6vw}.col td:first-child{color:#6B7280;width:48%}.col td:last-child{font-weight:700}
.col ul{margin:0;padding:0;list-style:none;font-size:min(2.8vw,4.6vh);line-height:1.35}.col li{margin:.5vh 0}.col li b{color:var(--c)}.col li small{display:block;font-size:.8em;color:#6B7280}
.big{background:#fff;border-radius:1.6vw;border-left:1.4vw solid var(--c);padding:1.6vh 2.2vw;font-size:min(3.4vw,5.6vh);font-weight:700;line-height:1.3;box-shadow:0 .5vh 1.6vh rgba(30,27,75,.1)}.big small{display:block;font-weight:400;font-size:.72em;color:#6B7280;margin-top:.4vh}
.big.sm{display:flex;gap:2vw;justify-content:space-between;font-size:min(2.7vw,4.4vh);padding:1vh 2vw}.big.sm span{flex:1}.big.sm .rv{color:#15803D}
.h{visibility:hidden}.in{animation:in .45s both}@keyframes in{from{opacity:0;transform:translateY(2vh)}}@media (prefers-reduced-motion:reduce){.in{animation:none}}
</style></head><body><header><h1 id="t"></h1><span id="p"></span></header><main id="m"></main><footer><button class="g" id="bk">‹ Atrás</button><button id="nx">Siguiente</button></footer><script>
const SER='#DB2777',EST='#0E7490',NV='#1E1B4B',V='#15803D',R='#B91C1C',O='#EA580C';
const tb=(c,h,rows)=>`<div class="col" style="--c:${c}"><h2>${h}</h2><table>${rows.map((r,k)=>`<tr><td>${r[0]}</td><td class="rv">${r[1]}</td></tr>`).join('')}</table></div>`;
const P=['yo','tú','él / ella','nosotros','vosotros','ellos / ellas'];
const S=[
{t:'PLAN DE LA CLASE',h:`<div class="plan">${[['Conjugar SER y ESTAR',SER],['¿Cuándo se utilizan? · Una frase con SER, una con ESTAR',EST],['Juego interactivo',O],['Escribir la conclusión en el cuaderno',V],['Película',NV]].map((x,k)=>`<div style="--c:${x[1]}"><i>${k+1}</i>${x[0]}</div>`).join('')}</div>`},
{t:'1 · CONJUGAR',h:`<div class="act"><b>EN EL CUADERNO</b>Conjugo SER y ESTAR en presente.</div><div class="two">${tb(SER,'SER',P.map((p,k)=>[p,['soy','eres','es','somos','sois','son'][k]]))}${tb(EST,'ESTAR',P.map((p,k)=>[p,['estoy','estás','está','estamos','estáis','están'][k]]))}</div>`,rv:1},
{t:'EL PASADO · SER Y ESTAR',h:`<div class="act"><b>EN EL CUADERNO</b>Ahora en pasado: él / ella y ellos / ellas.</div><div class="two">${tb(SER,'SER',[['él / ella','fue'],['ellos / ellas','fueron']])}${tb(EST,'ESTAR',[['él / ella','estuvo'],['ellos / ellas','estuvieron']])}</div>`,rv:1},
{t:'EL PASADO · LOS VERBOS',h:`<div class="act"><b>EN EL CUADERNO</b>Conjugo en pasado: él / ella y ellos / ellas.</div><div class="two">${tb(O,'-AR · crear',[['él / ella','cre<u>ó</u>'],['ellos / ellas','cre<u>aron</u>']])}${tb(V,'-ER / -IR · descubrir',[['él / ella','descubr<u>ió</u>'],['ellos / ellas','descubr<u>ieron</u>']])}</div>`,rv:1},
{t:'EL PASADO · DEL PRESENTE AL PASADO',h:`<div class="act"><b>EN EL CUADERNO</b>Escribo las frases en pasado.</div>${[['La IA analiza las fotos.','La IA <u>analizó</u> las fotos.'],['La agencia crea a Aitana.','La agencia <u>creó</u> a Aitana.'],['El equipo descubre las figuras.','El equipo <u>descubrió</u> las figuras.'],['Boti responde a las preguntas.','Boti <u>respondió</u> a las preguntas.'],['El equipo está en Perú.','El equipo <u>estuvo</u> en Perú.']].map((x,k)=>`<div class="big sm" style="--c:${[O,SER,O,V,EST][k]}"><span>${k+1}. ${x[0]}</span><span class="rv">→ ${x[1]}</span></div>`).join('')}`,rv:5},
{t:'EL PASADO · MIS FRASES',h:`<div class="act"><b>EN EL CUADERNO</b>Escribo una frase con FUE y una frase con ESTUVO.</div><div class="big rv" style="--c:${SER}">Aitana <u>fue</u> la primera influencer virtual de España.<small>SER en pasado → fue</small></div><div class="big rv" style="--c:${EST}">El equipo de Japón <u>estuvo</u> en el desierto de Nazca.<small>ESTAR en pasado → estuvo</small></div>`,rv:2},
{t:'2 · ¿CUÁNDO SE UTILIZAN?',h:`<div class="act"><b>ORAL</b>¿Cuándo utilizo SER? ¿Cuándo utilizo ESTAR?</div><div class="two"><div class="col" style="--c:${SER}"><h2>SER</h2><ul class="rv"><li><b>¿Quién es? ¿Qué es?</b><small>la identidad, la profesión</small></li><li><b>¿De dónde es?</b><small>el origen</small></li><li><b>¿Cómo es?</b><small>la descripción</small></li></ul></div><div class="col" style="--c:${EST}"><h2>ESTAR</h2><ul class="rv"><li><b>¿Dónde está?</b><small>el lugar</small></li><li><b>¿Cómo está?</b><small>la emoción, el estado</small></li></ul></div></div>`,rv:1},
{t:'2 · UNA FRASE CON «SER»',h:`<div class="act" style="--c:${SER}"><b>EN EL CUADERNO</b>Escribo una frase con SER sobre la secuencia.</div><div class="big rv" style="--c:${SER}">Aitana <u>es</u> una influencer virtual.<small>¿Quién es? → SER</small></div><div class="big rv" style="--c:${SER}">Aitana <u>es</u> de Barcelona.<small>¿De dónde es? → SER</small></div><div class="big rv" style="--c:${SER}">Las figuras de Nazca <u>son</u> gigantes.<small>¿Cómo son? → SER</small></div>`,rv:3},
{t:'2 · UNA FRASE CON «ESTAR»',h:`<div class="act" style="--c:${EST}"><b>EN EL CUADERNO</b>Escribo una frase con ESTAR sobre la secuencia.</div><div class="big rv" style="--c:${EST}">El desierto de Nazca <u>está</u> en Perú.<small>¿Dónde está? → ESTAR</small></div><div class="big rv" style="--c:${EST}">Buenos Aires <u>está</u> en Argentina.<small>¿Dónde está? → ESTAR</small></div><div class="big rv" style="--c:${EST}">El equipo <u>está</u> contento.<small>¿Cómo está? → ESTAR</small></div>`,rv:3},
{t:'3 · JUEGO INTERACTIVO',h:`<div class="act"><b>EN EQUIPOS</b>El gran quiz.</div><div class="plan"><div style="--c:${O}"><i>A</i>Una pregunta para un equipo, después una para el otro.</div><div style="--c:${V}"><i>+1</i>Respuesta correcta: un punto.</div><div style="--c:${R}"><i>↔</i>Respuesta falsa: el otro equipo contesta.</div></div>`},
{t:'4 · LA CONCLUSIÓN',h:`<div class="act"><b>EN EL CUADERNO</b>Copio la conclusión.</div><div class="big rv" style="--c:${V}">La IA nos <u>ayuda</u>: en la ciencia, la salud y la seguridad.</div><div class="big rv" style="--c:${R}">Pero también puede <u>engañarnos</u>: con imágenes, vídeos y voces falsas.</div><div class="big rv" style="--c:${NV}">Por eso, tenemos que <u>verificar</u> la información.</div>`,rv:3},
{t:'5 · PELÍCULA',h:`<div class="act"><b>MIRO Y ESCUCHO</b>La película.</div>`}];
let i=0,s=0;const $=x=>document.getElementById(x);
function draw(anim){const d=S[i];$('t').textContent=d.t;$('p').textContent=(i+1)+' / '+S.length;$('m').innerHTML=d.h;const r=[...document.querySelectorAll('.rv')];const per=d.rv===1?r.length:1;r.forEach((e,k)=>{const st=d.rv===1?1:k+1;if(st>s)e.classList.add('h');else if(anim&&st===s)e.classList.add('in')});$('nx').textContent=s<(d.rv||0)?'Mostrar':(i<S.length-1?'Siguiente':'Fin');$('bk').style.visibility=i||s?'visible':'hidden'}
function fw(){const d=S[i];if(s<(d.rv||0)){s++;draw(1)}else if(i<S.length-1){i++;s=0;draw()}}
function bw(){if(s>0){s--;draw()}else if(i>0){i--;s=S[i].rv||0;draw()}}
$('nx').onclick=()=>{$('nx').blur();fw()};$('bk').onclick=()=>{$('bk').blur();bw()};
addEventListener('keydown',e=>{if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();fw()}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();bw()}else if(/^[1-5]$/.test(e.key)){i=S.findIndex(x=>x.t.startsWith(e.key+' ·'));s=0;draw()}else if(e.key.toLowerCase()==='p'){i=S.findIndex(x=>x.t.startsWith('EL PASADO'));s=0;draw()}});draw();
</script></body></html>
